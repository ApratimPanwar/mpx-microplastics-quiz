<!doctype html><meta charset=utf-8><meta name=viewport content="width=device-width"><title>Squeeze Test Bench</title>
<style>:root{--page:#f2f2ef}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){--page:#0b0b0b;color-scheme:dark}}
:root[data-theme="dark"]{--page:#0b0b0b;color-scheme:dark}
.iso{background:var(--anatomy-page)}

.iso{
  --anatomy-page:#0b0b0b;--anatomy-card:#131313;--anatomy-text:#a3a3a3;--anatomy-strong:#e6e6e6;--anatomy-muted:#6e6e6e;
  --anatomy-paper:#131313;--anatomy-face:#1b1b1b;--anatomy-top:#1c1c1c;
  --anatomy-shade-0:#0f0f0f;--anatomy-shade-1:#121212;--anatomy-shade-2:#151515;--anatomy-shade-3:#181818;
  --anatomy-lit-top:#262626;--anatomy-lit-shade:#1d1d1d;
  --anatomy-hi:#d4d4d4;--anatomy-mid:#6a6a6a;--anatomy-lo:#3e3e3e;--anatomy-faint:#2a2a2a;--anatomy-lit:#ffffff;
  --anatomy-halo:#050505;--anatomy-halo-opacity:.9;--anatomy-dot:#e6e6e6;
  --anatomy-red:#ff6b6b;--anatomy-green:#6be0a0;--anatomy-blue:#6b9bff;
  --anatomy-weight:.6px;--anatomy-ease:cubic-bezier(.32,.72,0,1);
  --anatomy-mono:ui-monospace,"SF Mono",Menlo,Consolas,monospace;
  --anatomy-lift:inset 0 1px 0 0 #ffffff0a,inset 0 0 0 1px #ffffff06,0 0 0 1px #00000026,0 1px 1px -.5px #00000014,0 3px 3px -1.5px #00000014,0 6px 6px -3px #00000014,0 12px 12px -6px #00000014;
}
.iso[data-theme="light"]{
  --anatomy-page:#f2f2ef;--anatomy-card:#fbfbfa;--anatomy-text:#57575a;--anatomy-strong:#18181a;--anatomy-muted:#8c8c90;
  --anatomy-paper:#fbfbfa;--anatomy-face:#ffffff;--anatomy-top:#ffffff;
  --anatomy-shade-0:#dcdcd9;--anatomy-shade-1:#e5e5e2;--anatomy-shade-2:#ededea;--anatomy-shade-3:#f4f4f1;
  --anatomy-lit-top:#ffffff;--anatomy-lit-shade:#eeeeeb;
  --anatomy-hi:#26262a;--anatomy-mid:#8a8a8f;--anatomy-lo:#b4b4b8;--anatomy-faint:#d4d4d6;--anatomy-lit:#000000;
  --anatomy-halo:#8a8a80;--anatomy-halo-opacity:.32;--anatomy-dot:#3a3a3e;
  --anatomy-red:#e5484d;--anatomy-green:#30a46c;--anatomy-blue:#3e63dd;
  --anatomy-lift:inset 0 1px 0 0 #ffffff,0 0 0 1px #0000000f,0 1px 1px -.5px #0000000a,0 3px 3px -1.5px #0000000a,0 6px 6px -3px #0000000a,0 12px 12px -6px #0000000a;
}
.iso-svg{display:block;width:100%;height:auto;overflow:visible}
.iso-svg path,.iso-svg circle{vector-effect:non-scaling-stroke}
.iso-fill{fill:var(--anatomy-paper);stroke:none}
.iso-solid[data-lit]>.iso-fill{fill:var(--anatomy-face)}
.iso-shade,.iso-top{stroke:none}
.iso-shade[data-shade="0"]{fill:var(--anatomy-shade-0)}
.iso-shade[data-shade="1"]{fill:var(--anatomy-shade-1)}
.iso-shade[data-shade="2"]{fill:var(--anatomy-shade-2)}
.iso-shade[data-shade="3"]{fill:var(--anatomy-shade-3)}
.iso-top{fill:var(--anatomy-top)}
.iso-solid[data-lit]>.iso-top{fill:var(--anatomy-lit-top)}
.iso-solid[data-lit]>.iso-shade{fill:var(--anatomy-lit-shade)}
.iso-solid[data-seamless]>.iso-shade,.iso-solid[data-seamless]>.iso-top{stroke-width:.4;stroke-linejoin:round}
.iso-solid[data-seamless]>.iso-shade[data-shade="0"]{stroke:var(--anatomy-shade-0)}
.iso-solid[data-seamless]>.iso-shade[data-shade="1"]{stroke:var(--anatomy-shade-1)}
.iso-solid[data-seamless]>.iso-shade[data-shade="2"]{stroke:var(--anatomy-shade-2)}
.iso-solid[data-seamless]>.iso-shade[data-shade="3"]{stroke:var(--anatomy-shade-3)}
.iso-solid[data-seamless]>.iso-top{stroke:var(--anatomy-top)}
.iso-solid[data-seamless][data-lit]>.iso-top{stroke:var(--anatomy-lit-top)}
.iso-solid[data-seamless][data-lit]>.iso-shade{stroke:var(--anatomy-lit-shade)}
.iso-solid[data-lit]>.iso-edge{stroke:var(--anatomy-lit)}
.iso-halo{fill:var(--anatomy-halo);stroke:none;filter:blur(9px);opacity:var(--anatomy-halo-opacity);transform:translateY(3px)}
.iso-line{fill:none;stroke:var(--anatomy-lo);stroke-width:var(--anatomy-weight);stroke-linecap:round;stroke-linejoin:round}
.iso-line[data-tone="hi"]{stroke:var(--anatomy-hi)}
.iso-line[data-tone="mid"]{stroke:var(--anatomy-mid)}
.iso-line[data-tone="lo"]{stroke:var(--anatomy-lo)}
.iso-line[data-tone="faint"]{stroke:var(--anatomy-faint)}
.iso-line[data-tone="lit"]{stroke:var(--anatomy-lit)}
.iso-line[data-tone="red"]{stroke:var(--anatomy-red)}
.iso-line[data-tone="green"]{stroke:var(--anatomy-green)}
.iso-line[data-tone="blue"]{stroke:var(--anatomy-blue)}
.iso-line[data-dotted]{stroke-dasharray:.01 3.5;stroke-width:1}
.iso-line[data-dashed]{stroke-dasharray:3 3}
.iso-line[data-flow]{stroke-dasharray:2 6}
.iso-wire-end{fill:var(--anatomy-paper);stroke:var(--anatomy-lo);stroke-width:var(--anatomy-weight)}
.iso-wire[data-tone="hi"] .iso-wire-end{stroke:var(--anatomy-hi)}
.iso-wire[data-tone="mid"] .iso-wire-end{stroke:var(--anatomy-mid)}
.iso-wire[data-tone="faint"] .iso-wire-end{stroke:var(--anatomy-faint)}
.iso-wire[data-tone="lit"] .iso-wire-end{stroke:var(--anatomy-lit)}
.iso-dots circle{fill:var(--anatomy-dot);stroke:none;opacity:.32}
.iso-dots[data-tone="hi"] circle{opacity:.85}
.iso-dots[data-tone="mid"] circle{opacity:.45}
.iso-dots[data-tone="lo"] circle{opacity:.22}
.iso-dots[data-tone="faint"] circle{opacity:.12}
.iso-face-text{fill:var(--anatomy-mid);font-family:var(--anatomy-mono);letter-spacing:.04em}
.iso-face-text[data-tone="hi"]{fill:var(--anatomy-hi)}
.iso-face-text[data-tone="lo"]{fill:var(--anatomy-lo)}
.iso-face-text[data-tone="faint"]{fill:var(--anatomy-faint)}
.tb-body{fill:var(--anatomy-shade-2);stroke:none}
.tb-shine{fill:var(--anatomy-top);stroke:none}
.tb-shade{fill:var(--anatomy-shade-0);stroke:none}
.tb-ring{fill:none;stroke:var(--anatomy-lo);stroke-width:.45;stroke-linecap:butt;stroke-linejoin:round}
.tb-ring[data-tone="mid"]{stroke:var(--anatomy-mid)}
.tb-ring[data-tone="faint"]{stroke:var(--anatomy-faint)}
.tb-ring[data-tone="hi"]{stroke:var(--anatomy-hi)}
@keyframes iso-flow{to{stroke-dashoffset:-32}}
@keyframes iso-pulse{0%,100%{opacity:.18}12%{opacity:1}40%{opacity:.18}}
.iso-line[data-flow]{animation:iso-flow 1600ms linear infinite}
.iso-dots circle[data-pulse]{animation:iso-pulse 1600ms steps(1,end) infinite;animation-delay:var(--pulse-at,0ms)}
.iso-figure{margin:32px 0 36px}
.iso-plate{position:relative;padding:52px 24px;border-radius:0;background:var(--anatomy-card);box-shadow:0 0 0 1px var(--anatomy-mid);--anatomy-paper:var(--anatomy-card)}
.iso-plate-corners{position:absolute;inset:18px 20px;pointer-events:none}
.iso-plate-corner{position:absolute;color:var(--anatomy-muted);font-family:var(--anatomy-mono);font-size:10.5px;line-height:1;letter-spacing:.04em;white-space:nowrap}
.iso-plate-corner[data-corner="fig"]{top:0;left:0;color:var(--anatomy-text)}
.iso-plate-corner[data-corner="title"]{top:0;right:0;text-transform:uppercase;letter-spacing:.1em}
.iso-plate-corner[data-corner="hint"]{bottom:0;left:0;text-transform:uppercase;letter-spacing:.1em}
.iso-plate-corner[data-corner="readout"]{right:0;bottom:0;color:var(--anatomy-text);font-variant-numeric:tabular-nums}
.iso-plate .iso-svg{margin:0 auto}
.iso-legend{display:grid;gap:8px;margin-top:12px;color:var(--anatomy-muted);font-size:13px;line-height:1.55}
.iso-keys{display:flex;flex-wrap:wrap;gap:6px 18px}
.iso-key{display:inline-flex;align-items:center;gap:7px}
.iso-swatch{width:16px;height:10px;flex:none;overflow:visible}
.iso-swatch path{fill:none;stroke:var(--anatomy-hi);stroke-width:1;vector-effect:non-scaling-stroke;stroke-linejoin:round;stroke-linecap:round}
.iso-swatch[data-mark="raised"] path,.iso-swatch[data-mark="flat"] path{stroke:var(--anatomy-mid)}
.iso-swatch[data-mark="lit"] path{stroke:var(--anatomy-lit)}
.iso-swatch[data-mark="dim"] path{stroke:var(--anatomy-lo)}
.iso-swatch[data-mark="dotted"] path{stroke-dasharray:.01 3;stroke-width:1.4}
.iso-swatch[data-mark="dashed"] path{stroke-dasharray:3 2.5}
.iso-swatch[data-mark="red"] path{stroke:var(--anatomy-red)}
.iso-swatch[data-mark="green"] path{stroke:var(--anatomy-green)}
.iso-swatch[data-mark="blue"] path{stroke:var(--anatomy-blue)}
.iso-swatch-crease{stroke:var(--anatomy-lo)!important}
@media (max-width:560px){.iso-plate{padding:48px 12px 70px}.iso-plate-corner[data-corner="hint"]{bottom:18px}}
@media (prefers-reduced-motion:reduce){.iso-line[data-flow],.iso-dots circle[data-pulse]{animation:none}}

*{box-sizing:border-box}
body{margin:0;background:var(--page);color:var(--anatomy-text);font:14px/1.6 ui-sans-serif,system-ui,-apple-system,"Segoe UI",sans-serif;-webkit-font-smoothing:antialiased}
.iso-page{width:min(900px,100% - 32px);margin:64px auto 96px}
</style>
<div class="iso" data-theme="light"><main class="iso-page"><style>.sq{--water:#7fb2d9;--dirt:#8a6a3c;--cake:#a07a42;--ok:#2f8f5b;--bad:#c2412d;--lcd:#1d2a22;--lcd-t:#9fe0b0;--screen:#0e1418;--field:#e9eef0;--mp:#c2412d;--glass-a:.38}
.iso[data-theme="dark"] .sq{--water:#3d6f99;--dirt:#c9a46a;--cake:#c9a46a;--ok:#4cc38a;--bad:#ff7a5c;--lcd:#0c120e;--lcd-t:#7fd39a;--screen:#05080a;--field:#20282c;--mp:#ff8a66}
.sq .iso-plate{padding:52px 20px 44px}
.sq-stage{position:relative;outline:none;touch-action:pan-y}
.sq-stage:focus-visible{outline:1px solid var(--anatomy-muted);outline-offset:6px}
.sq .iso-svg{max-width:640px}
/* parts */
.sq .glass>.iso-fill{fill:var(--anatomy-paper);fill-opacity:var(--glass-a)}
.sq .glass>.iso-shade,.sq .glass>.iso-top{opacity:.4}
.sq .pet>.iso-edge{stroke:var(--anatomy-mid)}
.sq .water{--wt:var(--water)}
.sq .water-solid>.iso-fill{fill:color-mix(in srgb,var(--water) 24%,var(--anatomy-paper))}
.sq .water-solid>.iso-shade{fill:color-mix(in srgb,var(--water) 32%,var(--anatomy-paper))}
.sq .water-solid>.iso-top{fill:color-mix(in srgb,var(--water) 18%,var(--anatomy-paper))}
.sq .water-solid>.iso-edge{stroke:color-mix(in srgb,var(--water) 60%,var(--anatomy-paper))}
.sq .holed>.iso-fill,.sq .holed>.iso-edge{fill-rule:evenodd}
.sq .jet{fill:none;stroke:var(--water);stroke-linecap:round;stroke-dasharray:3 2;animation:sqflow .5s linear infinite}
.sq .cake{fill:var(--cake);mix-blend-mode:multiply}
.iso[data-theme="dark"] .sq .cake{mix-blend-mode:screen}
.sq .cake-p,.sq .dirt{fill:var(--dirt)}
.sq .tray-in{fill:var(--anatomy-shade-0)}
.sq .lcd{fill:var(--lcd)}
.sq .lcd-t{fill:var(--lcd-t);font:600 6px var(--anatomy-mono)}
.sq .screen{fill:var(--screen)}
.sq .field{fill:var(--field)}
.sq .mp{fill:var(--mp)}
.sq .scalebar{stroke:var(--field);stroke-width:.6}
.sq .flowmark{fill:none;stroke:var(--water);stroke-width:1.6;stroke-linecap:round;stroke-dasharray:2 5;animation:sqflow 1s linear infinite;transition:opacity .4s}
.sq .flowmark[data-dir="rev"]{stroke:var(--dirt);animation-direction:reverse}
@keyframes sqflow{to{stroke-dashoffset:-7}}
.sq [data-cls="tap"]{transition:none}
/* legend */
.sq-modes{display:flex;flex-wrap:wrap;gap:8px;align-items:center}
.sq-mode,.sq-btn{display:inline-flex;gap:8px;align-items:center;padding:7px 12px;border:0;border-radius:6px;background:var(--anatomy-card);color:var(--anatomy-text);font:13px/1.2 system-ui,sans-serif;cursor:pointer;box-shadow:var(--anatomy-lift)}
.sq-mode[data-on]{color:var(--anatomy-strong);box-shadow:var(--anatomy-lift),0 0 0 1px var(--anatomy-hi)}
.sq-num{font:11px var(--anatomy-mono);color:var(--anatomy-muted)}
.sq-controls{display:flex;flex-wrap:wrap;gap:8px 18px;margin:4px 0;font:12px/1.3 var(--anatomy-mono);color:var(--anatomy-text)}
.sq-slider,.sq-select{display:inline-flex;align-items:center;gap:8px}
.sq-slider input{width:110px;accent-color:var(--anatomy-hi)}
.sq-slider b{font-weight:500;color:var(--anatomy-strong);min-width:54px;font-variant-numeric:tabular-nums}
.sq-select select{font:12px var(--anatomy-mono);background:var(--anatomy-card);color:var(--anatomy-strong);border:1px solid var(--anatomy-lo);border-radius:5px;padding:3px 6px}
.sq-grid{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1.25fr);gap:10px}
.sq-card{min-width:0;padding:10px 12px;border-radius:6px;background:var(--anatomy-card);box-shadow:var(--anatomy-lift)}
.sq-h{font:600 12px/1.3 var(--anatomy-mono);color:var(--anatomy-strong);margin-bottom:6px;letter-spacing:.02em}
.sq-chart{width:100%;height:auto;display:block}
.sq-chart text{font:10.5px var(--anatomy-mono);fill:var(--anatomy-muted)}
.sq-chart .lab{fill:var(--anatomy-text)}
.sq-chart .grid{stroke:var(--anatomy-faint);stroke-width:.6}
.sq-chart .axis{stroke:var(--anatomy-mid);stroke-width:.8}
.sq-chart .ok{fill:var(--ok);fill-opacity:.07}
.sq-chart .ref{stroke:var(--anatomy-mid);stroke-width:.8;stroke-dasharray:3 3}
.sq-chart .reft{fill:var(--anatomy-muted);font-size:10px}
.sq-chart .c-clean{fill:none;stroke:var(--anatomy-hi);stroke-width:1.6}
.sq-chart .c-now{fill:none;stroke:var(--dirt);stroke-width:1.8}
.sq-chart .c-other{fill:none;stroke:var(--anatomy-mid);stroke-width:1.2;stroke-dasharray:5 3}
.sq-chart .op{fill:var(--dirt);stroke:var(--anatomy-card);stroke-width:1.5}
.sq-note{font-size:12.5px;line-height:1.5;color:var(--anatomy-text);margin-top:4px}
.sq-note b,.sq-explain b{color:var(--anatomy-strong);font-weight:600}
.k{display:inline-block;width:14px;height:2px;margin:0 5px 3px 6px;vertical-align:middle}
.k-clean{background:var(--anatomy-hi)}.k-now{background:var(--dirt)}.k-other{background:repeating-linear-gradient(90deg,var(--anatomy-mid) 0 5px,transparent 5px 8px)}
.sq-req,.sq-bands{width:100%;border-collapse:collapse;font-size:12.5px;color:var(--anatomy-text)}
.sq-req td,.sq-bands td,.sq-bands th{padding:4px 6px;border-top:1px solid var(--anatomy-faint);vertical-align:top}
.sq-bands th{text-align:left;font:600 11px var(--anatomy-mono);color:var(--anatomy-muted)}
.sq-req .v{font:12px var(--anatomy-mono);color:var(--anatomy-strong);white-space:nowrap;font-variant-numeric:tabular-nums}
.sq-req .t{font:11.5px var(--anatomy-mono);color:var(--anatomy-muted);white-space:nowrap}
.chip{display:inline-block;padding:1px 7px;border-radius:9px;font:600 11px var(--anatomy-mono)}
.chip[data-pass="true"]{color:var(--ok);background:color-mix(in srgb,var(--ok) 14%,transparent)}
.chip[data-pass="false"]{color:var(--bad);background:color-mix(in srgb,var(--bad) 14%,transparent)}
.chip[data-pass="na"]{color:var(--anatomy-muted);background:var(--anatomy-faint)}
.sq-explain{font-size:13.5px;line-height:1.55;color:var(--anatomy-text)}
.sq-explain p{margin:0 0 8px}
.sq-split{display:grid;grid-template-columns:minmax(0,1fr) 220px;gap:14px;align-items:start}
.sq-scope{margin:0}
.sq-scope svg{width:100%;height:auto;display:block}
.sq-scope .bf{fill:var(--screen)}
.sq-scope .field{fill:var(--field)}
.sq-scope .sb{stroke:var(--anatomy-strong);stroke-width:2}
.sq-scope .sbt{font:10px var(--anatomy-mono);fill:var(--anatomy-strong)}
.sq-scope figcaption{font-size:12px;line-height:1.45;color:var(--anatomy-muted);margin-top:6px}
.sq-scope figcaption b{color:var(--anatomy-strong)}
.sq-sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0)}
@media (max-width:720px){.sq-grid,.sq-split{grid-template-columns:1fr}.sq-scope{max-width:260px}.sq-slider input{width:86px}}

    `<path class="c-other" d="${curve(GRADES[other].KL, 0, 0)}"/><path class="c-clean" d="${curve(g.KL, 0, 0)}"/><path class="c-now" d="${curve(g.KL, ALPHA * s.cake / AREA, s.Rirr)}"/>` +
    `<circle class="op" cx="${X(Fop)}" cy="${Y(Qop)}" r="4"/>`;
  q('[data-part="chart-note"]').innerHTML = `<span class="k k-clean"></span>${g.label} clean <span class="k k-now"></span>with today's cake <span class="k k-other"></span>${GRADES[other].label} clean. ` +
    `Reaching ${TARGET_LMIN} L/min takes <b>${Math.max(0, fNeed).toFixed(0)} N</b> now${inp.grade === "0.2" ? `; a ${Math.round((areaForComfort(b, g.KL) - Math.PI / 4 * 4e-4) / (Math.PI * 0.02) * 1000)} mm sintered length (instead of 85.5) would bring the clean figure to ${COMFORT_N} N` : ""}.`;
}

// critically damped spring toward target; returns true while still moving
function settle(o, target, dt, T, calm) {
  if (calm) { const m = o.x !== target; o.x = target; o.v = 0; return m; }
  const w = 2 * Math.PI / T, a = -w * w * (o.x - target) - 2 * w * o.v;
  o.v += a * dt; o.x += o.v * dt;
  if (Math.abs(o.x - target) < 1e-3 && Math.abs(o.v) < 1e-3) { o.x = target; o.v = 0; return false; }
  return true;
}
// ---------------- loop ----------------
let frame = 0, last = 0, visible = false, chartAt = 0;
function tick(now) {
  const dt = last ? Math.min((now - last) / 1000, 1 / 20) : 1 / 60; last = now;
  const calm = still.matches;
  // springs on the moving groups, staggered so the bottle leaves before the head drops and the beaker moves first
  const T = TARGETS[mode];
  let moving = false;
  for (const k of ["bottle", "tap", "beaker", "head"]) {
    let target = T[k];
    if (k === "head" && target === 1 && share.beaker.x < 0.6) target = 0;
    if (k === "beaker" && target === 0 && share.head.x > 0.3) target = 1;
    if (k === "head" && target === 1 && share.bottle.x < 0.7) target = 0;
    if (k === "tap" && target === 1 && share.bottle.x < 0.6) target = 0;
    if (settle(share[k], target, dt, 0.32, calm)) moving = true;
  }
  // simulation
  const simDt = dt * inp.speed;
  if (mode === "squeeze" && share.bottle.x < 0.05) {
    if (s.bottleL > 0.0005) { for (let i = 0; i < 4; i++) s = stepSqueeze(s, inp, simDt / 4); }
    else { refillAt += dt; if (refillAt > 2.5) { s.bottleL = BOTTLES[inp.bottle].L; refillAt = 0; } }
  } else if (mode === "backflush" && share.tap.x > 0.9) {
    if (bfCake === null) bfCake = s.cake;
    const mp0 = s.mp;
    for (let i = 0; i < 4; i++) s = stepBackflush(s, inp, simDt / 4 / 3);
    trayMP += mp0 - s.mp;
    if (s.cake < bfCake * 0.03 && bfStart !== null && s.lastRecovery === null) s.lastRecovery = nowQ() / cleanQ();
  }
  if (mode !== "backflush") bfCake = null;
  draw(dt);
  words(false);
  if (now - chartAt > 600 || dirty) { chart(); chartAt = now; dirty = false; words(true); }
  frame = visible ? requestAnimationFrame(tick) : 0;
}
function kick() { if (!frame && visible) { last = 0; frame = requestAnimationFrame(tick); } }
new IntersectionObserver((e) => { visible = e[e.length - 1].isIntersecting; if (visible) kick(); }, { rootMargin: "120px 0px" }).observe(stage);
draw(0); chart(); words(true);
</script>

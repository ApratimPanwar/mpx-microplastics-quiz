<text x="920.0" y="842.4" font-size="11" font-weight="700" fill="#111827" text-anchor="start">NOTES</text>
<text x="920.0" y="860.8" font-size="10" font-weight="400" fill="#111827" text-anchor="start">1. Prototype: turn from Ø35 bar; bore Ø28 H9 reamed full length; thin wall 1.0 ±0.05 between threads.</text>
<text x="920.0" y="879.2" font-size="10" font-weight="400" fill="#111827" text-anchor="start">2. Production option: 316L tube 30 × 1.0 with TIG-welded threaded ferrules; same envelope.</text>
<text x="920.0" y="897.6" font-size="10" font-weight="400" fill="#111827" text-anchor="start">3. Threads M32×1.0-6g both ends, 9 long, 45° chamfer 0.5; ends faced square for O-ring S2 (Ra ≤ 0.8).</text>
<text x="920.0" y="916.0" font-size="10" font-weight="400" fill="#111827" text-anchor="start">4. Item 8: 40 µm twilled Dutch weave 316L, punched Ø20 -0.05; item 9 presses it into the coupler counterbore.</text>

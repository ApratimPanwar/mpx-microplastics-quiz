<g stroke="#111827" fill="none" stroke-width="1.2"><path d="M1492.0,1065.0 L1512.0,1061.0 L1512.0,1083.0 L1492.0,1079.0 Z"/><circle cx="1534.0" cy="1072.0" r="11"/><circle cx="1534.0" cy="1072.0" r="5"/></g>
<text x="920.0" y="824.0" font-size="11" font-weight="700" fill="#111827" text-anchor="start">NOTES</text>
<text x="920.0" y="842.4" font-size="10" font-weight="400" fill="#111827" text-anchor="start">1. Bottle thread: 28 PCO 1881 internal, cut to major Ø28.4 / minor Ø26.0 (0.5 mm radial clearance on the neck).</text>
<text x="920.0" y="860.8" font-size="10" font-weight="400" fill="#111827" text-anchor="start">2. Pitch 2.7; number of starts (1 vs 3) differs between sources: measure 5 local 500 mL and 1 L bottles and a cap first.</text>
<text x="920.0" y="879.2" font-size="10" font-weight="400" fill="#111827" text-anchor="start">3. Gasket S1 (Ø25.5/Ø19 × 1.5 silicone) sits on the seat at 15.5 deep; the bottle lip compresses it ~0.4 mm.</text>
<text x="920.0" y="897.6" font-size="10" font-weight="400" fill="#111827" text-anchor="start">4. Body thread M32×1.0-6H, 9 deep; O-ring S2 groove on the web face (see sheet 7).</text>
<text x="920.0" y="916.0" font-size="10" font-weight="400" fill="#111827" text-anchor="start">5. Diamond knurl 0.8 pitch from 2 to 14; break all sharp edges 0.2.</text>

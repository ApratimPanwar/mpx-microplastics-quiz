<text x="191.5" y="820.0" font-family="Arial, Helvetica, sans-serif" font-size="11.5" font-weight="normal" fill="rgb(70, 69, 62)" text-anchor="start">Level 1 branches show one global weight each (their local weight equals their global weight, since the root's weight is 1.000); the four sum to 1.000: 0.462 + 0.231 + 0.231 + 0.077. Sub-objective cards below them show [local weight — among that branch's siblings][global weight — share</text>

<text x="76.0" y="883.8" font-family="Arial, Helvetica, sans-serif" font-size="11.5" font-weight="normal" fill="rgb(70, 69, 62)" text-anchor="start">D = Demand (mandatory — tier reflects prioritisation, not permission to drop) · W = Wish (desirable — tier reflects genuine trade-off headroom). Full pairwise-comparison matrices and the ranked 22-item table are in the accompanying report.</text>

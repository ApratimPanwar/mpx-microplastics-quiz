<?xml version="1.0" encoding="UTF-8"?>
<svg viewBox="0 0 1560 2398" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="mpx-detection-mechanism-map-title mpx-detection-mechanism-map-desc">
<title id="mpx-detection-mechanism-map-title">How could you actually detect a microplastic?</title>
<desc id="mpx-detection-mechanism-map-desc">Mind-map of ten physical, chemical, electrical and acoustic detection mechanisms grouped into four families — light and color, electricity and charge, heat and mass, mechanical and acoustic — each tagged as portable, emerging, or lab-only, with cross-links showing related mechanisms across families.</desc>

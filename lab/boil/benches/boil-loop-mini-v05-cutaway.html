}
.iso-svg{display:block;width:100%;height:auto;overflow:visible}
.iso-svg path,.iso-svg circle{vector-effect:non-scaling-stroke}
.iso-fill{fill:var(--anatomy-paper);stroke:none}
.iso-solid[data-lit]>.iso-fill{fill:var(--anatomy-face)}
.iso-shade,.iso-top{stroke:none}
.iso-shade[data-shade="0"]{fill:var(--anatomy-shade-0)}
.iso-shade[data-shade="1"]{fill:var(--anatomy-shade-1)}
.iso-shade[data-shade="2"]{fill:var(--anatomy-shade-2)}
.iso-shade[data-shade="3"]{fill:var(--anatomy-shade-3)}
.iso-top{fill:var(--anatomy-top)}
.iso-solid[data-lit]>.iso-top{fill:var(--anatomy-lit-top)}
.iso-solid[data-lit]>.iso-shade{fill:var(--anatomy-lit-shade)}
.iso-solid[data-seamless]>.iso-shade,.iso-solid[data-seamless]>.iso-top{stroke-width:.4;stroke-linejoin:round}
.iso-solid[data-seamless]>.iso-shade[data-shade="0"]{stroke:var(--anatomy-shade-0)}
.iso-solid[data-seamless]>.iso-shade[data-shade="1"]{stroke:var(--anatomy-shade-1)}
.iso-solid[data-seamless]>.iso-shade[data-shade="2"]{stroke:var(--anatomy-shade-2)}
.iso-solid[data-seamless]>.iso-shade[data-shade="3"]{stroke:var(--anatomy-shade-3)}
.iso-solid[data-seamless]>.iso-top{stroke:var(--anatomy-top)}
.iso-solid[data-seamless][data-lit]>.iso-top{stroke:var(--anatomy-lit-top)}
.iso-solid[data-seamless][data-lit]>.iso-shade{stroke:var(--anatomy-lit-shade)}
.iso-solid[data-lit]>.iso-edge{stroke:var(--anatomy-lit)}
.iso-halo{fill:var(--anatomy-halo);stroke:none;filter:blur(9px);opacity:var(--anatomy-halo-opacity);transform:translateY(3px)}
.iso-line{fill:none;stroke:var(--anatomy-lo);stroke-width:var(--anatomy-weight);stroke-linecap:round;stroke-linejoin:round}
.iso-line[data-tone="hi"]{stroke:var(--anatomy-hi)}
.iso-line[data-tone="mid"]{stroke:var(--anatomy-mid)}
.iso-line[data-tone="lo"]{stroke:var(--anatomy-lo)}
.iso-line[data-tone="faint"]{stroke:var(--anatomy-faint)}
.iso-line[data-tone="lit"]{stroke:var(--anatomy-lit)}
.iso-line[data-tone="red"]{stroke:var(--anatomy-red)}
.iso-line[data-tone="green"]{stroke:var(--anatomy-green)}
.iso-line[data-tone="blue"]{stroke:var(--anatomy-blue)}
.iso-line[data-dotted]{stroke-dasharray:.01 3.5;stroke-width:1}
.iso-line[data-dashed]{stroke-dasharray:3 3}
.iso-line[data-flow]{stroke-dasharray:2 6}
.iso-wire-end{fill:var(--anatomy-paper);stroke:var(--anatomy-lo);stroke-width:var(--anatomy-weight)}
.iso-wire[data-tone="hi"] .iso-wire-end{stroke:var(--anatomy-hi)}
.iso-wire[data-tone="mid"] .iso-wire-end{stroke:var(--anatomy-mid)}
.iso-wire[data-tone="faint"] .iso-wire-end{stroke:var(--anatomy-faint)}
.iso-wire[data-tone="lit"] .iso-wire-end{stroke:var(--anatomy-lit)}
.iso-dots circle{fill:var(--anatomy-dot);stroke:none;opacity:.32}
.iso-dots[data-tone="hi"] circle{opacity:.85}
.iso-dots[data-tone="mid"] circle{opacity:.45}
.iso-dots[data-tone="lo"] circle{opacity:.22}
.iso-dots[data-tone="faint"] circle{opacity:.12}
.iso-face-text{fill:var(--anatomy-mid);font-family:var(--anatomy-mono);letter-spacing:.04em}
.iso-face-text[data-tone="hi"]{fill:var(--anatomy-hi)}
.iso-face-text[data-tone="lo"]{fill:var(--anatomy-lo)}
.iso-face-text[data-tone="faint"]{fill:var(--anatomy-faint)}
.tb-body{fill:var(--anatomy-shade-2);stroke:none}
.tb-shine{fill:var(--anatomy-top);stroke:none}
.tb-shade{fill:var(--anatomy-shade-0);stroke:none}
.tb-ring{fill:none;stroke:var(--anatomy-lo);stroke-width:.45;stroke-linecap:butt;stroke-linejoin:round}
.tb-ring[data-tone="mid"]{stroke:var(--anatomy-mid)}
.tb-ring[data-tone="faint"]{stroke:var(--anatomy-faint)}
.tb-ring[data-tone="hi"]{stroke:var(--anatomy-hi)}
@keyframes iso-flow{to{stroke-dashoffset:-32}}
@keyframes iso-pulse{0%,100%{opacity:.18}12%{opacity:1}40%{opacity:.18}}
.iso-line[data-flow]{animation:iso-flow 1600ms linear infinite}
.iso-dots circle[data-pulse]{animation:iso-pulse 1600ms steps(1,end) infinite;animation-delay:var(--pulse-at,0ms)}
.iso-figure{margin:32px 0 36px}
.iso-plate{position:relative;padding:52px 24px;border-radius:0;background:var(--anatomy-card);box-shadow:0 0 0 1px var(--anatomy-mid);--anatomy-paper:var(--anatomy-card)}
.iso-plate-corners{position:absolute;inset:18px 20px;pointer-events:none}
.iso-plate-corner{position:absolute;color:var(--anatomy-muted);font-family:var(--anatomy-mono);font-size:10.5px;line-height:1;letter-spacing:.04em;white-space:nowrap}
.iso-plate-corner[data-corner="fig"]{top:0;left:0;color:var(--anatomy-text)}
.iso-plate-corner[data-corner="title"]{top:0;right:0;text-transform:uppercase;letter-spacing:.1em}
.iso-plate-corner[data-corner="hint"]{bottom:0;left:0;text-transform:uppercase;letter-spacing:.1em}
.iso-plate-corner[data-corner="readout"]{right:0;bottom:0;color:var(--anatomy-text);font-variant-numeric:tabular-nums}
.iso-plate .iso-svg{margin:0 auto}
.iso-legend{display:grid;gap:8px;margin-top:12px;color:var(--anatomy-muted);font-size:13px;line-height:1.55}
.iso-keys{display:flex;flex-wrap:wrap;gap:6px 18px}
.iso-key{display:inline-flex;align-items:center;gap:7px}
.iso-swatch{width:16px;height:10px;flex:none;overflow:visible}
.iso-swatch path{fill:none;stroke:var(--anatomy-hi);stroke-width:1;vector-effect:non-scaling-stroke;stroke-linejoin:round;stroke-linecap:round}
.iso-swatch[data-mark="raised"] path,.iso-swatch[data-mark="flat"] path{stroke:var(--anatomy-mid)}
.iso-swatch[data-mark="lit"] path{stroke:var(--anatomy-lit)}
.iso-swatch[data-mark="dim"] path{stroke:var(--anatomy-lo)}
.iso-swatch[data-mark="dotted"] path{stroke-dasharray:.01 3;stroke-width:1.4}
.iso-swatch[data-mark="dashed"] path{stroke-dasharray:3 2.5}
.iso-swatch[data-mark="red"] path{stroke:var(--anatomy-red)}
.iso-swatch[data-mark="green"] path{stroke:var(--anatomy-green)}
.iso-swatch[data-mark="blue"] path{stroke:var(--anatomy-blue)}
.iso-swatch-crease{stroke:var(--anatomy-lo)!important}
@media (max-width:560px){.iso-plate{padding:48px 12px 70px}.iso-plate-corner[data-corner="hint"]{bottom:18px}}
@media (prefers-reduced-motion:reduce){.iso-line[data-flow],.iso-dots circle[data-pulse]{animation:none}}

*{box-sizing:border-box}
html{color-scheme:dark}
body[data-theme="light"]{color-scheme:light}
body{margin:0;background:var(--anatomy-page);color:var(--anatomy-text);font:14px/1.6 ui-sans-serif,system-ui,-apple-system,"Segoe UI",sans-serif;-webkit-font-smoothing:antialiased}
.iso-page{width:min(780px,100% - 32px);margin:64px auto 96px}
</style></head><body class="iso" data-theme="light"><main class="iso-page"><style>.bl{--t-cold:#2f6fae;--t-mid:#c39a82;--t-hot:#d1491e;--water:#7fb2d9;--glass-a:.42}
.iso[data-theme="dark"] .bl{--t-cold:#5b9be0;--t-mid:#a8846c;--t-hot:#f06a3c;--water:#3d6f99}
.bl .iso-plate{padding:52px 20px 44px}
.bl-stage{position:relative;outline:none}
.bl-stage:focus-visible{outline:1px solid var(--anatomy-muted);outline-offset:6px}
.bl .iso-svg{max-width:640px}
/* parts */
.bl .flow{fill:none;stroke-width:1.15;stroke-linecap:round;stroke-dasharray:1.2 4.2;transition:opacity .6s}
.bl .stream{fill:none;stroke:var(--water);stroke-width:1.4;stroke-dasharray:3 2;opacity:0;transition:opacity .8s}
.bl .puff{fill:var(--anatomy-muted);opacity:0}
.bl .hx-ann{fill:color-mix(in srgb,var(--t-cold) 30%,var(--anatomy-paper));stroke:none}
.bl .hx-in{fill:color-mix(in srgb,var(--t-hot) 55%,var(--anatomy-paper));stroke:none}
.bl .glow{fill:var(--t-hot);opacity:0;mix-blend-mode:multiply;pointer-events:none}
.iso[data-theme="dark"] .bl .glow{mix-blend-mode:screen}
.bl .glass>.iso-fill{fill:var(--anatomy-paper);fill-opacity:var(--glass-a)}
.bl .glass>.iso-shade,.bl .glass>.iso-top{opacity:.45}
.bl .water{--wt:var(--water)}
.bl .water-solid>.iso-fill{fill:color-mix(in srgb,var(--wt) 16%,var(--anatomy-paper))}
.bl .water-solid>.iso-shade{fill:color-mix(in srgb,var(--wt) 24%,var(--anatomy-paper))}
.bl .water-solid>.iso-top{fill:color-mix(in srgb,var(--wt) 12%,var(--anatomy-paper))}
.bl .water-solid>.iso-edge{stroke:color-mix(in srgb,var(--wt) 60%,var(--anatomy-paper))}
.bl [data-part="cupwater"]{--wt:var(--water)}
.bl .cup-in{fill:var(--anatomy-shade-0);fill-opacity:.5}
.bl .foam>.iso-shade,.bl .foam>.iso-top{opacity:.85}
.bl .aero>.iso-top,.bl .aero>.iso-shade{fill:var(--anatomy-shade-3)}
.bl .vent{fill:var(--anatomy-shade-0)}
.bl .cavity{fill:var(--anatomy-shade-0)}
.bl .pump-bed{fill:var(--anatomy-shade-1);stroke:var(--anatomy-mid);stroke-width:.6}
.bl .pump-tube{fill:none;stroke:var(--anatomy-lo);stroke-width:2.6;stroke-linecap:round}
.bl .rotor{fill:var(--anatomy-shade-3);stroke:var(--anatomy-mid);stroke-width:.6}
.bl .roller{fill:var(--anatomy-paper);stroke:var(--anatomy-hi);stroke-width:.6}
.bl .roller-hub,.bl .rotor-hub{fill:var(--anatomy-mid)}
.bl .board{fill:var(--anatomy-shade-2);stroke:var(--anatomy-mid);stroke-width:.5}
.bl .chip{fill:var(--anatomy-mid)}
.bl .pad{fill:var(--anatomy-hi)}
.bl .usbc{fill:var(--anatomy-shade-1);stroke:var(--anatomy-mid);stroke-width:.5}
.bl .usbc-in{fill:var(--anatomy-mid)}
.bl .bay-floor{fill:var(--anatomy-shade-1)}
/* focus */
.bl .unit[data-focus] .it:not([data-on]){opacity:.32;transition:opacity .35s}
.bl .unit .it{transition:opacity .35s}
.bl .it[data-on] .iso-edge{stroke:var(--anatomy-lit)}
.bl .it[data-on] .iso-solid>.iso-top{fill:var(--anatomy-lit-top)}
/* controls */
.bl-controls{display:flex;flex-wrap:wrap;gap:10px 18px;align-items:center;margin:2px 0 4px;font:12px/1.3 var(--anatomy-mono);color:var(--anatomy-text)}
.bl-btn{display:inline-flex;align-items:center;gap:7px;padding:6px 11px;border:0;border-radius:6px;background:var(--anatomy-card);color:var(--anatomy-strong);font:inherit;cursor:pointer;box-shadow:var(--anatomy-lift)}
.bl-lamp{width:7px;height:7px;border-radius:50%;background:var(--anatomy-lo)}
.bl-btn[data-on] .bl-lamp{background:var(--t-hot)}
.bl-slider{display:inline-flex;align-items:center;gap:8px}
.bl-slider input{width:96px;accent-color:var(--anatomy-hi)}
.bl-slider b{font-weight:500;color:var(--anatomy-strong);min-width:64px;font-variant-numeric:tabular-nums}
.bl-check{display:inline-flex;align-items:center;gap:6px;cursor:pointer}
.bl-check input{accent-color:var(--t-hot)}
.bl-stations{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:6px}
.bl-st{display:grid;grid-template-columns:auto 1fr auto;gap:6px;align-items:baseline;padding:7px 9px;border:0;border-radius:6px;background:var(--anatomy-card);color:var(--anatomy-text);font:12px/1.3 system-ui,sans-serif;text-align:left;cursor:pointer;box-shadow:var(--anatomy-lift)}
.bl-st[data-on]{color:var(--anatomy-strong);box-shadow:var(--anatomy-lift),0 0 0 1px var(--anatomy-hi)}
.bl-num{font:11px var(--anatomy-mono);color:var(--anatomy-muted)}
.bl-t{font:12px var(--anatomy-mono);font-variant-numeric:tabular-nums}
.bl-panel{display:grid;gap:6px;padding:10px 12px;border-radius:6px;background:var(--anatomy-card);box-shadow:var(--anatomy-lift);min-height:86px}
.bl-explain{color:var(--anatomy-text);font-size:13.5px;line-height:1.55}
.bl-explain b{color:var(--anatomy-strong);font-weight:600}
.bl-stats{display:flex;flex-wrap:wrap;gap:4px 16px;font:11.5px/1.5 var(--anatomy-mono);color:var(--anatomy-muted)}
.bl-stats b{color:var(--anatomy-strong);font-weight:500}
.bl-sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0)}
@media (max-width:640px){.bl-stations{grid-template-columns:repeat(2,minmax(0,1fr))}.bl-controls{gap:8px 12px}.bl-slider input{width:80px}}
@media (prefers-reduced-motion:reduce){.bl .flow,.bl .unit .it{transition:none}}
.bl .clear>.iso-fill{fill-opacity:.12}.bl .clear>.iso-shade,.bl .clear>.iso-top{opacity:.18}
.bl .mesh{fill:var(--anatomy-shade-2);stroke:var(--anatomy-lo);stroke-width:.5}
.bl .lime{fill:#f3f1ea;stroke:var(--anatomy-mid);stroke-width:.35}
.iso[data-theme="dark"] .bl .lime{fill:#cfcbc0;stroke:#5a5a5a}
.bl .ret{stroke-width:1.1}
.bl .cap-glass{fill:var(--water);fill-opacity:.06;stroke:none}
.bl .holed>.iso-fill,.bl .holed>.iso-edge{fill-rule:evenodd}

om Yu et al. 2024 (1 − e^(−0.0086·lime)). The run is a lumped transient from switch-on: the gate stays shut until the core reaches 95 °C, and until then the boil coil overflows through the standpipe back into the jug.</span></figcaption></figure></main><script type="module">const AZIMUTH = 45;
const ELEVATION = 30;
const SHADES = 4;
const RADIANS = Math.PI / 180;
const UNIT = Math.sqrt(1.6);
function cameraOf({ scale, azimuth = AZIMUTH, elevation = ELEVATION }) {
    const a = azimuth * RADIANS;
    const e = elevation * RADIANS;
    return { sinA: Math.sin(a), cosA: Math.cos(a), sinE: Math.sin(e), cosE: Math.cos(e), k: scale * UNIT };
}
function iso([x, y, z], projection) {
    const { origin } = projection;
    const { sinA, cosA, sinE, cosE, k } = cameraOf(projection);

    if (p.age > 2.8 && steaming && !calm && Math.random() < dtReal * 1.6 * steaming) { p.age = 0; p.dx = (Math.random() - 0.5) * 6; }
    const a = p.age;
    const life = a < 2.8 ? Math.min(1, a / 0.35) * Math.exp(-a / 1.1) : 0;
    p.el.setAttribute("cx", (DATA.stand[0] + p.dx * a + a * 2).toFixed(1));
    p.el.setAttribute("cy", (DATA.stand[1] - 4 - a * 16).toFixed(1));
    p.el.setAttribute("r", (2 + a * 4).toFixed(1));
    p.el.style.opacity = (life * 0.55).toFixed(3);
  }
  // lime caught this run: one dot ~ 1 mg
  const shown = Math.min(limeDots.length, Math.round(sim.lime / 1.0));
  limeDots.forEach((el, i) => { const want = i < shown ? "1" : "0"; if (el.getAttribute("opacity") !== want) el.setAttribute("opacity", want); });
  drawWater();
}

// ---------- words ----------
const f1 = (v) => v.toFixed(1), f0 = (v) => v.toFixed(0);
const STATIONS = { 1: "jug", 2: "pump", 3: "hx", 4: "heat", 5: "boil", 6: "trap", 7: "body", 8: "spout" };
let sel = 0, lastText = 0;
function explainFor(n, L, Sd) {
  const mlmin = (inputs.Q * 1000) / 60;
  switch (n) {
    case 1: return `<b>01 · Jug.</b> Borosilicate 3.3 glass, 0.53 L to the mark, wall 3 mm, with a fused chimney for the vent. Now ${f0(sim.Mj * 1000)} mL at ${f1(sim.Tj)} °C. While the wax gate is shut the boil coil overflows back in here through the standpipe, so the jug itself warms during warm-up.`;
    case 2: return `<b>02 · Pump.</b> Peristaltic head with three rollers on PharMed tube, run straight off the 20 V USB-C rail: ${f1(inputs.Q)} L/h = ${f1(mlmin)} mL/min. Only the tube touches the water; no valve, no sensor, no board.${inputs.stat ? ` With the proposed thermostat it waits until the core reaches ${PUMP_STAT.on} °C (now ${sim.pumpOn ? "running" : "waiting"}).` : ""}`;
    case 3: return `<b>03 · Exchanger, cold side.</b> 2.4 m of 3/8″ × 0.71 316L tube in 11.9 turns (Ø64) around a 3/16″ inner tube. Cold water climbs the annulus and takes ${f1(L.e * 100)}% of the heat coming back down: ${f1(sim.Tj)} → ${f1(L.coldOut)} °C before the heater. Without it the heater would need ${f0(Sd.heater.noExchanger)} W instead of ${f0(Sd.heater.total)} W.`;
    case 4: return `<b>04 · Mini-tube heater.</b> A 20 V 60 W cartridge in an Ø20 × 44 aluminium block, with 0.6 m of 1/8″ tube wound in its helical groove. In steady running it only adds the last ${f1(TB - Sd.coldOut)} K, the steam and the losses: ${f1(Sd.heater.total)} W of 60 (sensible ${f1(Sd.heater.sensible)}, steam ${f1(Sd.heater.steam)}, losses ${f1(Sd.heater.losses)}). Core now ${f1(sim.core)} °C; a KSD301 cuts it at 105 °C if the jug runs dry.`;
    case 5: return `<b>05 · Boil coil and vent.</b> 0.65 m of 1/2″ × 0.89 316L tube holds 61 mL: at ${f1(inputs.Q)} L/h each drop spends ${f1(Sd.boilMin)} min at ${TB} °C. Calcium bicarbonate loses CO₂ and comes out as calcite, which crusts around particles. The standpipe vents the steam and CO₂; venting is what makes the lime: a sealed coil forms about four times less at 80 mg/L.`;
    case 6: return `<b>06 · Lime trap and wax gate.</b> A 25 µm 316L Dutch-weave cartridge in a twist-out drawer catches the lime with the plastics locked in it. At ${f0(inputs.H)} mg/L hardness about ${f0(Sd.lime)} mg of lime forms per litre, so about ${f0(Sd.removal * 100)}% of microplastics are removed (Yu et al. 2024). The wax gate behind stays shut below 92–95 °C, so unboiled water can't pass: it is ${L.gateOpen ? "open" : "shut"}. ${f0(sim.lime)} mg caught this run.`;
    case 7: return `<b>07 · Exchanger hot side and body coil.</b> Boiled water falls through the 3/16″ inner tube and hands its heat to the water coming up: ${TB} → ${f1(Sd.hotOut)} °C. Then 2 m of 3/16″ tube in the finned 6063 shell's grooves trims it to ${f1(Sd.outlet)} °C; the shell sits at ${f1(Sd.shell)} °C, safe to hold.`;
    case 8: return `<b>08 · Spout.</b> A 3/16″ bulkhead union through the shell and a short spout with an M8 nozzle, 124 mm clear over the cup bay. ${L.producing ? `Water out at ${f1(sim.out)} °C, ` : "No water yet; "}${f0(sim.cup)} mL delivered this run${cups ? ` (${cups} cup${cups > 1 ? "s" : ""} swapped)` : ""}.`;
  }
  return "";
}
function overview(L, Sd) {
  const p = sim.phase;
  if (p === "heating core") return `<b>Heating the core.</b> The proposed thermostat holds the pump off while the heater brings the still water in the boil coil to ${PUMP_STAT.on} °C (${f1(sim.core)} °C now). Hover a part to read about it.`;
  if (p === "warm-up" || p === "filling") return `<b>Warming up.</b> The wax gate is shut, so the pumped water boils off nothing yet: it climbs the standpipe and overflows back into the jug, which slowly warms (${f1(sim.Tj)} °C). The gate opens when the core passes 95 °C (${f1(sim.core)} °C now). Hover a part to read about it.`;
  if (p === "gate open") return `<b>Gate open.</b> Hot water starts down the exchanger's inner tube; within a few minutes it preheats the incoming water and the heater's load falls to about ${f0(Sd.heater.total)} W.`;
  if (p === "producing") return `<b>Producing.</b> ${f1(inputs.Q)} L/h at ${f1(sim.out)} °C. The exchanger recovers ${f0(L.e * 100)}% of the heat, so the 60 W heater runs at about ${f0(Sd.heater.total)} W${Math.abs(sim.Tj - inputs.Ta) > 3 ? `; the outlet is warm because the jug water was warmed to ${f1(sim.Tj)} °C during warm-up` : ""}.`;
  if (p === "jug empty" || p === "done") return `<b>Jug empty.</b> The pump runs dry, the core overheats and the KSD301 cuts the heater. ${f0(sim.cup)} mL delivered, ${f0(sim.lime)} mg of lime in the trap, ${f1(sim.Wh)} Wh used. Refill to run again.`;
  return "";
}
function refreshText(force) {
  const now = performance.now();
  if (!force && now - lastText < 200) return;
  lastText = now;
  const L = loopState();
  const Sd = steady({ ...inputs, Tj: inputs.Ta });
  explain.innerHTML = sel ? explainFor(sel, L, Sd) : overview(L, Sd);
  const fw = firstWater === null ? "—" : `${f0(firstWater / 60)} min`;
  stats.innerHTML = `<span>steady at ${f0(inputs.Ta)} °C room: <b>${f1(Sd.heater.total)} W</b> heater · ε <b>${Sd.eps.toFixed(3)}</b> · out <b>${f1(Sd.outlet)} °C</b> · boil <b>${f1(Sd.boilMin)} min</b> · MP removal <b>${f0(Sd.removal * 100)}%</b></span><span>this run: t <b>${f0(sim.t / 60)} min</b> · first water <b>${fw}</b> · delivered <b>${f0(sim.cup)} mL</b> · <b>${f1(sim.Wh)} Wh</b></span>`;
  const T = { jug: sim.Tj, pump: sim.Tj, hx: L.coldOut, heat: sim.core, boil: sim.core, trap: L.gateOpen ? sim.core : null, body: L.gateOpen ? L.hotOut : null, spout: L.producing ? sim.out : null };
  root.querySelectorAll("[data-t]").forEach((el) => { const v = T[el.dataset.t]; el.textContent = v === null || v === undefined ? (el.dataset.t === "trap" ? "shut" : "—") : `${f1(v)}°`; el.style.color = v ? tint(v) : ""; });
  const r = sim.phase === "producing" ? `producing · ${f1(sim.out)} °C out · ${f0(sim.heater && sim.core >= TB - 0.2 ? Sd.heater.total : sim.heater)} W`
    : sim.phase === "jug empty" || sim.phase === "done" ? `jug empty · ${f0(sim.cup)} mL out`
    : `${sim.phase} · core ${f0(sim.core)} °C · gate ${L.gateOpen ? "open" : "shut"}`;
  if (readout.textContent !== r) readout.textContent = r;
  if (sim.phase !== phaseSaid) { phaseSaid = sim.phase; status.textContent = sim.phase; }
}

// ---------- selection ----------
function select(n) {
  sel = n;
  if (n) unit.setAttribute("data-focus", ""); else unit.removeAttribute("data-focus");
  fig.setAttribute("data-sel", n || "");
  items.forEach((el) => (+el.dataset.st === n ? el.setAttribute("data-on", "") : el.removeAttribute("data-on")));
  root.querySelectorAll(".bl-st").forEach((b) => (+b.dataset.sel === n ? b.setAttribute("data-on", "") : b.removeAttribute("data-on")));
  refreshText(true);
}
let leaveTimer = 0;
fig.addEventListener("pointermove", (e) => {
  const it = e.target.closest("[data-st]");
  clearTimeout(leaveTimer);
  if (it && +it.dataset.st !== sel) select(+it.dataset.st);
});
fig.addEventListener("pointerleave", () => { leaveTimer = setTimeout(() => select(0), 700); });
root.querySelectorAll(".bl-st").forEach((b) => {
  b.addEventListener("mouseenter", () => select(+b.dataset.sel));
  b.addEventListener("focus", () => select(+b.dataset.sel));
  b.addEventListener("click", () => select(sel === +b.dataset.sel ? 0 : +b.dataset.sel));
});
stage.addEventListener("keydown", (e) => {
  if (e.key === " ") { e.preventDefault(); setRunning(!running); }
  else if (e.key === "r" || e.key === "R") restart();
  else if (e.key === "ArrowRight" || e.key === "ArrowDown") { e.preventDefault(); select(sel >= 8 ? 1 : sel + 1); }
  else if (e.key === "ArrowLeft" || e.key === "ArrowUp") { e.preventDefault(); select(sel <= 1 ? 8 : sel - 1); }
  else if (e.key === "Escape") select(0);
});

// ---------- loop ----------
let frame = 0, last = 0, visible = false;
function tick(now) {
  const dt = last ? Math.min((now - last) / 1000, 1 / 20) : 1 / 60;
  last = now;
  if (running) {
    simAcc += dt * speed;
    let n = Math.floor(simAcc); simAcc -= n;
    n = Math.min(n, 900);
    for (let i = 0; i < n && sim.phase !== "done"; i++) {
      sim = step(sim, inputs, 1);
      if (firstWater === null && sim.cup > 0.5) firstWater = sim.t;
    }
    if (sim.phase === "done") { doneAt += dt; if (doneAt > 5) restart(); }
  }
  draw(dt);
  refreshText(false);
  frame = visible ? requestAnimationFrame(tick) : 0;
}
function kick() { if (!frame && visible) { last = 0; frame = requestAnimationFrame(tick); } }
new IntersectionObserver((entries) => { visible = entries[entries.length - 1].isIntersecting; if (visible) kick(); }, { rootMargin: "120px 0px" }).observe(stage);
setRunning(running);
refreshText(true);
draw(0);
</script></body></html>

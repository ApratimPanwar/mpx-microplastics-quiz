<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Drinking Water Microplastics Assessment</title>
<style>
  :root.viz-root, .viz-root {
    color-scheme: light;
    --surface-1:      #fcfcfb;
    --page:           #f9f9f7;
    --text-primary:   #0b0b0b;
    --text-secondary: #52514e;
    --text-muted:     #898781;
    --gridline:       #e1e0d9;
    --baseline:       #c3c2b7;
    --border:         rgba(11,11,11,0.10);
    --series-blue:    #2a78d6;
    --series-blue-soft: #cde2fb;
    --good:      #0ca30c;
    --warning:   #fab219;
    --serious:   #ec835a;
    --critical:  #d03b3b;
  }
  @media (prefers-color-scheme: dark) {
    .viz-root {
      color-scheme: dark;
      --surface-1:      #1a1a19;
      --page:           #0d0d0d;
      --text-primary:   #ffffff;
      --text-secondary: #c3c2b7;
      --text-muted:     #898781;
      --gridline:       #2c2c2a;
      --baseline:       #383835;
      --border:         rgba(255,255,255,0.10);
      --series-blue:    #3987e5;
      --series-blue-soft: #184f95;
      --good:      #0ca30c;
      --warning:   #fab219;
      --serious:   #ec835a;
      --critical:  #d03b3b;
    }
  }
  * { box-sizing: border-box; }
  body {
    margin: 0;
    font-family: system-ui, -apple-system, "Segoe UI", sans-serif;
    background: var(--page);
    color: var(--text-primary);
  }
  .app {
    max-width: 640px;
    margin: 0 auto;
    padding: 24px 18px 80px;
    min-height: 100vh;
  }
  .topbar {
    position: sticky;
    top: 0;
    background: var(--page);
    padding: 10px 0 14px;
    z-index: 5;
  }
  .brand {
    font-size: 13px;
    color: var(--text-muted);
    margin-bottom: 10px;
    letter-spacing: 0.02em;
  }
  .progress-track {
    height: 6px;
    background: var(--gridline);
    border-radius: 4px;
    overflow: hidden;
  }
  .progress-fill {
    height: 100%;
    background: var(--series-blue);
    border-radius: 4px;
    transition: width 0.3s ease;
    width: 0%;
  }
  .progress-label {
    font-size: 12px;
    color: var(--text-muted);
    margin-top: 6px;
    text-align: right;
  }
  .card {
    background: var(--surface-1);
    border: 1px solid var(--border);
    border-radius: 14px;
    padding: 28px 24px;
    margin-top: 18px;
  }
  h1 { font-size: 26px; margin: 0 0 12px; line-height: 1.25; }
  h2 { font-size: 20px; margin: 0 0 6px; line-height: 1.3; }
  .section-tag {
    font-size: 12px;
    font-weight: 600;
    text-transform: uppercase;
    letter-spacing: 0.06em;
    color: var(--series-blue);
    margin-bottom: 8px;
  }
  p.lede { color: var(--text-secondary); font-size: 15px; line-height: 1.55; }
  .hint { font-size: 13px; color: var(--text-muted); margin-top: -2px; margin-bottom: 6px; }
  .multi-note { font-size: 12px; color: var(--series-blue); font-weight: 600; margin-top: -2px; margin-bottom: 6px; }
  .q-source {
    font-size: 12px;
    color: var(--text-muted);
    margin-top: -2px;
    margin-bottom: 16px;
    padding-left: 10px;
    border-left: 2px solid var(--gridline);
    line-height: 1.4;
  }
  .q-source strong { color: var(--text-secondary); font-weight: 600; }
  .options { display: flex; flex-direction: column; gap: 10px; margin-top: 16px; }
  .opt {
    display: flex;
    align-items: flex-start;
    gap: 12px;
    padding: 13px 14px;
    border: 1px solid var(--border);
    border-radius: 10px;
    cursor: pointer;
    transition: border-color 0.15s ease, background 0.15s ease;
    font-size: 15px;
  }
  .opt:hover { border-color: var(--series-blue); }
  .opt input { margin-top: 3px; accent-color: var(--series-blue); width: 17px; height: 17px; flex-shrink: 0; }
  .opt.checked { border-color: var(--series-blue); background: color-mix(in srgb, var(--series-blue) 8%, transparent); }
  .opt span.label { flex: 1; }
  .opt .sub { display: block; font-size: 12.5px; color: var(--text-muted); margin-top: 2px; }
  input[type="text"], input[type="email"], input[type="number"] {
    width: 100%;
    padding: 12px 14px;
    border: 1px solid var(--border);
    border-radius: 10px;
    font-size: 15px;
    background: var(--surface-1);
    color: var(--text-primary);
    margin-top: 14px;
  }
  input[type="text"]:focus, input[type="email"]:focus, input[type="number"]:focus,
  .opt:focus-within { outline: 2px solid var(--series-blue); outline-offset: 1px; }
  .scale-row { display: flex; gap: 8px; margin-top: 18px; }
  .scale-btn {
    flex: 1;
    padding: 14px 6px;
    text-align: center;
    border: 1px solid var(--border);
    border-radius: 10px;
    cursor: pointer;
    font-weight: 600;
    font-size: 15px;
    transition: border-color 0.15s ease, background 0.15s ease;
  }
  .scale-btn:hover { border-color: var(--series-blue); }
  .scale-btn.checked { border-color: var(--series-blue); background: color-mix(in srgb, var(--series-blue) 12%, transparent); color: var(--series-blue); }
  .scale-labels { display: flex; justify-content: space-between; font-size: 12px; color: var(--text-muted); margin-top: 8px; }
  .nav-row { display: flex; gap: 10px; margin-top: 26px; }
  button.nav {
    flex: 1;
    padding: 14px;
    border-radius: 10px;
    font-size: 15px;
    font-weight: 600;
    cursor: pointer;
    border: 1px solid var(--border);
    background: var(--surface-1);
    color: var(--text-primary);
  }
  button.nav.primary { background: var(--series-blue); color: #fff; border-color: var(--series-blue); }
  button.nav.primary:disabled { opacity: 0.45; cursor: not-allowed; }
  button.nav.ghost { flex: 0 0 90px; }
  .required-note { font-size: 12px; color: var(--text-muted); margin-top: 10px; }
  /* intro */
  .intro-facts { display:flex; flex-direction:column; gap:10px; margin: 18px 0; }
  .intro-fact { display:flex; gap:10px; font-size: 14px; color: var(--text-secondary); }
  .intro-fact .dot { width:6px; height:6px; border-radius:50%; background: var(--series-blue); margin-top:7px; flex-shrink:0; }
  /* results */
  .hero { text-align: center; margin: 8px 0 4px; }
  .hero .value { font-size: 56px; font-weight: 700; line-height: 1; }
  .hero .of100 { font-size: 18px; color: var(--text-muted); font-weight: 500; }
  .tier-badge {
    display: inline-flex; align-items: center; gap: 7px;
    padding: 7px 14px; border-radius: 999px; font-weight: 700; font-size: 14px;
    margin: 12px auto 4px; color: #fff;
  }
  .meter-track { height: 14px; background: var(--gridline); border-radius: 8px; margin-top: 20px; overflow: hidden; }
  .meter-fill { height: 100%; border-radius: 8px; transition: width 0.6s ease; }
  .meter-scale { display:flex; justify-content: space-between; font-size: 11px; color: var(--text-muted); margin-top: 6px; }
  .breakdown { margin-top: 22px; }
  .breakdown h3, .summary-block h3, .research-block h3, .context-block h3 { font-size: 14px; text-transform: uppercase; letter-spacing: .04em; color: var(--text-muted); margin-bottom: 10px; }
  .factor-row { display:flex; justify-content: space-between; align-items: center; padding: 9px 0; border-bottom: 1px solid var(--gridline); font-size: 14px; }
  .factor-row:last-child { border-bottom: none; }
  .factor-name { color: var(--text-primary); }
  .factor-pts { color: var(--text-muted); font-variant-numeric: tabular-nums; }
  .tip-box { margin-top: 22px; padding: 16px 18px; border-radius: 10px; background: color-mix(in srgb, var(--series-blue) 7%, var(--surface-1)); border: 1px solid var(--series-blue-soft); font-size: 14.5px; line-height: 1.55; }
  .tip-box strong { color: var(--series-blue); }
  .summary-block, .context-block { margin-top: 22px; font-size: 14px; color: var(--text-secondary); line-height: 1.6; }
  .research-block { margin-top: 22px; border-top: 1px solid var(--gridline); padding-top: 18px; }
  .research-item { margin-bottom: 14px; font-size: 13.5px; line-height: 1.55; color: var(--text-secondary); }
  .research-item .src-tag { display:block; font-size: 12px; color: var(--text-muted); margin-top: 3px; }
  .disclaimer { margin-top: 22px; font-size: 12px; color: var(--text-muted); line-height: 1.5; border-top: 1px solid var(--gridline); padding-top: 14px; }
  .download-row { display:flex; gap:10px; margin-top: 22px; }
  .submit-status { margin-top: 14px; font-size: 12.5px; padding: 10px 12px; border-radius: 8px; line-height: 1.5; }
  .submit-status.ok { background: color-mix(in srgb, var(--good) 12%, transparent); color: var(--good); }
  .submit-status.warn { background: color-mix(in srgb, var(--warning) 16%, transparent); color: var(--text-secondary); }
  @media (max-width: 420px) {
    .hero .value { font-size: 44px; }
    .scale-row { flex-wrap: wrap; }
    .scale-btn { min-width: 52px; }
  }
</style>
</head>
<body class="viz-root">
<div class="app">
  <div class="topbar">
    <div class="brand">MPx &middot; Drinking Water Microplastics Assessment</div>
    <div class="progress-track"><div class="progress-fill" id="progressFill"></div></div>
    <div class="progress-label" id="progressLabel"></div>
  </div>
  <div id="stepContainer"></div>
</div>

<script>
(function () {
  "use strict";

  /* ---------------------------------------------------------
     SUBMISSION CONFIG
     Paste your Google Apps Script Web App URL here once it's
     deployed (see the companion setup file) to have every
     completed response auto-saved to a shared Google Sheet.
     Leave blank and the quiz still works fully — respondents
     just rely on the download buttons instead.
  --------------------------------------------------------- */
  const SUBMIT_URL = "https://script.google.com/macros/s/AKfycbyY8_H-bufqC3lC_fTqsUsoS_6VBrt1TDbpu8fPWk_E3_1fOsVG9fgSsOVNi5INYMy6VA/exec"; // e.g. "https://script.google.com/macros/s/XXXXXXX/exec"

  /* ---------------------------------------------------------
     STEP DEFINITIONS
     type: intro | text | number | radio | checkbox | scale | results
     Every question that references a claim carries its own `source`
     line, shown inline (never a separate interstitial screen), so
     nothing primes an answer before it's given.
     `cap` on a checkbox limits how many options can be picked.
  --------------------------------------------------------- */
  const steps = [
    { id: "intro", type: "intro" },

    // ---- Section A: Basics ----
    { id: "name", type: "text", section: "Basics", title: "What should we call you?", hint: "Optional — leave blank to stay fully anonymous.", required: false, placeholder: "Your name" },
    { id: "email", type: "text", section: "Basics", title: "Email for follow-up (optional)", hint: "We'll only use this if you want to hear about the device once it's built. Never shared.", required: false, placeholder: "you@example.com" },
    { id: "age", type: "radio", section: "Basics", title: "What is your age group?", required: true,
      options: ["Under 18", "18-29", "30-39", "40-49", "50 and above"] },
    { id: "location", type: "radio", section: "Basics", title: "Where do you currently live?", required: true,
      options: ["Urban (city)", "Semi-urban (town)", "Rural (village)"] },
    { id: "householdSize", type: "radio", section: "Basics", title: "How many people, including you, live in your household?", required: true,
      hint: "Helps us size how many people one device could realistically serve.",
      options: ["Just me", "2-3", "4-5", "6 or more"] },
    { id: "education", type: "radio", section: "Basics", title: "What is the highest level of education you have completed?", required: true,
      options: ["High School / Secondary Education or below", "Bachelor's Degree / Some College / Vocational Training", "Master's Degree", "Doctorate / Professional Degree (e.g., PhD, MD, JD)", "Prefer not to say"] },
    { id: "income", type: "radio", section: "Basics", title: "What is your average annual household income?", required: true,
      options: ["Below ₹5,00,000", "₹5,00,000 - ₹8,00,000", "₹8,00,000 - ₹12,00,000", "₹12,00,000 - ₹20,00,000", "Above ₹20,00,000", "Prefer not to say"] },

    // ---- Section B: Water & food-contact plastic usage (SCORED) ----
    { id: "sources", type: "checkbox", section: "Your Water Habits", title: "Which of the following sources do you use to consume water in daily life?", required: true,
      hint: "Select all that apply.",
      source: "Bottled water has repeatedly tested with more microplastic particles than tap water in independent studies. — RSC Advances, 2026 review",
      options: ["Municipal Tap Water (Unfiltered)", "In-home Filter (e.g., RO, UV, Pitcher, Faucet attachment)", "Bottled Water (Single-use plastic bottles)", "Large Bottled Water (20-liter jugs)", "Public Water Cooler / Dispenser (office, campus, public spaces)", "Well Water / Ground Water", "Natural Spring / River Water", "Other"] },
    { id: "filter", type: "checkbox", section: "Your Water Habits", title: "What filter type or purification method(s) do you use at home?", required: true,
      hint: "Select all that apply — many households use more than one.",
      source: "Standard RO/UV/carbon filters are built for microbes and dissolved solids, not sub-micron plastic fragments. — RSC Advances, 2026 review",
      options: ["Reverse Osmosis (RO)", "UV (Ultraviolet) Purifier", "Carbon Filter / Pitcher (e.g., Brita, PUR)", "Boiling", "None / I drink direct tap/ground water", "Other"] },
    { id: "intake", type: "radio", section: "Your Water Habits", title: "On average, how much water do you drink per day?", required: true,
      options: ["Less than 1 Liter (under 4 cups)", "1 to 2 Liters (approx. 4-8 cups)", "2 to 3 Liters (approx. 8-12 cups)", "More than 3 Liters (12+ cups)"] },
    { id: "sitting", type: "radio", section: "Your Water Habits", title: "When you drink water in a single sitting, how much do you usually consume at once?", required: true,
      options: ["A few sips (Under 100 mL)", "Small glass (approx. 200-250 mL)", "Standard glass or cup (approx. 300-400 mL)", "Large tumbler or water bottle (500 mL-1L)"] },
    { id: "containers", type: "checkbox", section: "Your Water Habits", title: "Which of the following do you use to drink water in daily life?", required: true,
      hint: "Select all that apply.",
      options: ["Glass bottles / Glass cups", "Stainless Steel / Metal Bottle / Steel cups", "Reusable Plastic Bottle", "Single-use Disposable Plastic Bottle (Bisleri/Kinley type)", "Disposable Plastic Cups (events, offices, water coolers)", "Ceramic Cup / Mug"] },
    { id: "bottledFreq", type: "radio", section: "Your Water Habits", title: "How often do you buy single-use bottled water in a typical week?", required: true,
      options: ["Daily", "A few times a week", "Rarely", "Never"] },
    { id: "bottledBeverages", type: "radio", section: "Your Water Habits", title: "How often do you drink other beverages from plastic bottles (soda, sports drinks, iced tea, juice, etc.)?", required: true,
      source: "The same particle-shedding pathway found in bottled water applies to PET/plastic-bottled beverages generally. — RSC Advances, 2026 review",
      options: ["Daily", "A few times a week", "Rarely", "Never"] },
    { id: "hotBev", type: "radio", section: "Your Water Habits", title: "How often do you drink hot tea/coffee prepared or served in plastic cups, kettles, or plastic-lined containers?", required: true,
      source: "Heat accelerates plastic surfaces shedding particles and additives into liquid. — Groh et al., Science of the Total Environment, 2019",
      options: ["Often", "Sometimes", "Rarely", "Never"] },
    { id: "storage", type: "checkbox", section: "Your Water Habits", title: "How do you usually store drinking water at home?", required: true,
      hint: "Select all that apply.",
      options: ["Plastic containers / jugs", "Glass containers", "Stainless steel containers", "Direct from tap (no storage)", "Other"] },
    { id: "hotFoodFreq", type: "radio", section: "Your Water Habits", title: "In a typical week, how often do you eat hot food (including gravies/curries) served in plastic tiffins, takeaway containers, plastic kettles, or instant-noodle cups?", required: true,
      source: "Hot food/liquid contact with plastic packaging is a recognized leaching pathway for both particles and chemical additives. — North & Halden, Reviews on Environmental Health, 2013",
      options: ["None", "1-2 times a week", "3-5 times a week", "6+ times a week"] },
    { id: "clingFilm", type: "radio", section: "Your Water Habits", title: "How often do you use plastic wrap (cling film) directly on food?", required: true,
      source: "Direct food contact with plastic film is a recognized particle- and chemical-transfer pathway; packaging carries hundreds of associated chemicals. — Groh et al., Science of the Total Environment, 2019",
      options: ["Never", "Rarely", "Sometimes", "Often"] },
    { id: "packagedFood", type: "radio", section: "Your Water Habits", title: "How often do you eat packaged food in plastic wrapping (chips/crisps, biscuits, namkeen, instant noodles, etc.)?", required: true,
      source: "Microplastics have been detected across common packaged food and drink categories in independent testing (salt, sugar, honey, bottled water, tea bags). — Kamalasekaran & Sundramoorthy, RSC Advances, 2026",
      options: ["Never", "Rarely (1-2 times a week)", "Sometimes (3-5 times a week)", "Often (daily or more)"] },

    // ---- Section C: Other everyday exposure sources (context, not scored into the water number) ----
    { id: "kitchenHeat", type: "radio", section: "Beyond Water: Other Exposure Sources", title: "How often do you microwave or heat food in plastic containers or plastic wrap?", required: true,
      hint: "This is about food, not water — it gives us the fuller picture of your overall exposure.",
      source: "Food contact with heated plastic is a documented microplastic and chemical-leaching pathway, distinct from the water pathway. — North & Halden, 2013; lessmicroplastics.com/why",
      options: ["Never", "Rarely", "Sometimes", "Often"] },
    { id: "cookingUtensilFreq", type: "radio", section: "Beyond Water: Other Exposure Sources", title: "How often do you cook with plastic/nylon utensils (spatulas, spoons)?", required: true,
      source: "Heat and friction against cooking utensils are recognized mechanical microplastic-generation mechanisms. — Kamalasekaran & Sundramoorthy, RSC Advances, 2026",
      options: ["Never", "Rarely", "Sometimes", "Often"] },
    { id: "kitchenTools", type: "checkbox", section: "Beyond Water: Other Exposure Sources", title: "Which of these do you regularly use in your kitchen?", required: true,
      hint: "Select all that apply.",
      source: "Mechanical abrasion is a recognized microplastic-generation mechanism for plastic kitchenware; non-stick coatings involve a related but distinct chemical class (PFAS), worth separate awareness. — Kamalasekaran & Sundramoorthy, RSC Advances, 2026",
      options: ["Plastic cutting board", "Disposable plastic forks/spoons", "Non-stick (Teflon/PTFE) cookware", "Plastic or nylon cooking utensils (spatulas/spoons)", "None of these"] },
    { id: "syntheticLaundry", type: "radio", section: "Beyond Water: Other Exposure Sources", title: "Do you regularly wash synthetic clothing (polyester, nylon, fleece) in a washing machine?", required: true,
      source: "Wash cycles on synthetic fabrics are a well-documented source of microplastic fiber shedding into water systems. — cited in your team's proposal; lessmicroplastics.com/why (indoor dust & fibers)",
      options: ["Yes, regularly", "Occasionally", "No, mostly natural fibers", "Not sure"] },
    { id: "syntheticClothingPct", type: "radio", section: "Beyond Water: Other Exposure Sources", title: "Roughly how much of your clothing is synthetic (polyester/nylon/spandex)?", required: true,
      options: ["None — mostly natural fibers (cotton, wool, linen)", "A little — a few pieces", "About half", "Most of my wardrobe"] },
    { id: "personalCare", type: "radio", section: "Beyond Water: Other Exposure Sources", title: "How often do you use personal care products with exfoliating microbeads (some scrubs, toothpastes, facial cleansers)?", required: true,
      source: "Personal care products are an established primary-microplastic source. — Fendall & Sewell 2009, cited in Shen et al., Marine Pollution Bulletin, 2019",
      options: ["Often", "Sometimes", "Rarely", "Never / not sure"] },
    { id: "seafood", type: "radio", section: "Beyond Water: Other Exposure Sources", title: "How often do you eat seafood (fish/shellfish)?", required: true,
      source: "Microplastics are frequently transmitted through the food chain in aquatic organisms such as shellfish and seafood. — Kamalasekaran & Sundramoorthy, RSC Advances, 2026",
      options: ["Never", "Rarely (a few times a month or less)", "Weekly", "Almost daily"] },

    // ---- Section D: Product need & trust ----
    { id: "topWorry", type: "checkbox", section: "What You Actually Need", title: "Which of these worry you most about your drinking water?", required: true,
      cap: 2, hint: "Pick up to 2.",
      options: ["Microplastics", "Bacteria or other pathogens", "Heavy metals or chemical contaminants", "Taste or odor", "Nothing worries me"] },
    { id: "trustFilter", type: "scale", section: "What You Actually Need", title: "How much do you trust your current filtration method to remove microplastics specifically?", required: true,
      low: "No trust at all", high: "Complete trust" },
    { id: "infoPref", type: "radio", section: "What You Actually Need", title: "Would you rather know your water's microplastic level before it's filtered, after, or not at all?", required: true,
      options: ["Before filtration (see the raw contamination level)", "After filtration (confirm it worked)", "Both before and after", "I don't need to know — just filter it"] },
    { id: "trustBuilder", type: "checkbox", section: "What You Actually Need", title: "What would most increase your trust in a home water-safety product?", required: true,
      cap: 2, hint: "Pick up to 2.",
      options: ["A visible real-time reading/display", "Independent lab certification", "Government or NGO endorsement", "Brand reputation", "Nothing — I'd want to test it myself"] },
    { id: "concernGeneral", type: "scale", section: "What You Actually Need", title: "How concerned are you about the presence of microplastics in your primary drinking water?", required: true,
      low: "Not concerned at all", high: "Extremely concerned" },
    { id: "concernHealth", type: "scale", section: "What You Actually Need", title: "It has been stated by many recent studies that microplastics in drinking water may be linked to human health risks such as oxidative stress, hormonal imbalance, fertility and developmental issues. Does this concern you?", required: true,
      source: "WHO's 2019 review found current evidence for these specific risks limited and called for more research — see the full picture in your results.",
      low: "Not concerned at all", high: "Extremely concerned" },
    { id: "replaceLikelihood", type: "scale", section: "What You Actually Need", title: "How likely are you to replace your current filter/bottle setup with a dedicated microplastics detection + filtration device?", required: true,
      low: "Not likely at all", high: "Very likely" },

    // ---- Section E: Product & stakeholder opportunity ----
    { id: "features", type: "checkbox", section: "The Device You'd Want", title: "Which technology would you prefer to have in a drinking water filtration device?", required: true,
      hint: "Select all that apply.",
      options: ["Filter out microplastics", "Information about microplastics before filtration", "Information about microplastics after filtration", "Portability of the filtering/storing device", "Portability of the detection device", "None of the above, my current setup is sufficient"] },
    { id: "formFactor", type: "checkbox", section: "The Device You'd Want", title: "Which form factor(s) would you consider?", required: true,
      cap: 2, hint: "Pick up to 2.",
      options: ["Attaches to an existing bottle or tap", "Standalone pitcher / jug style", "Compact travel device (pocket/bag sized)", "Fixed, under-sink installation", "No strong preference"] },
    { id: "portabilityImportance", type: "scale", section: "The Device You'd Want", title: "How important is it that the device be portable (usable while travelling), versus a fixed home installation?", required: true,
      low: "Fixed home use only", high: "Must be fully portable" },
    { id: "wtp", type: "number", section: "The Device You'd Want", title: "If a portable device existed that could both detect and filter microplastics, how much would you be willing to pay for it, in Rupees?", required: true,
      hint: "For reference — a steel water bottle costs around ₹300; a household water filter costs around ₹8,000.", placeholder: "e.g. 2500" },
    { id: "subscriptionOk", type: "radio", section: "The Device You'd Want", title: "Would you be willing to pay an ongoing cost for filter cartridge replacement or sensor calibration?", required: true,
      options: ["Yes", "No", "Maybe, depends on the cost"] },
    { id: "purchaseChannel", type: "checkbox", section: "The Device You'd Want", title: "Where would you most likely buy or access a device like this?", required: true,
      cap: 2, hint: "Pick up to 2.",
      options: ["Online (e-commerce)", "Retail / electronics store", "Bundled through a water-purifier brand", "Government or NGO distribution program", "Not sure"] },
    { id: "purchaseLikelihood", type: "scale", section: "The Device You'd Want", title: "If this device existed at your stated price, how likely would you be to purchase it?", required: true,
      low: "Not likely at all", high: "Very likely" },

    { id: "results", type: "results" }
  ];

  const questionSteps = steps.filter(s => !["intro", "results"].includes(s.type));
  const totalQuestions = questionSteps.length;

  const answers = {};
  let current = 0;
  let submitAttempted = false;

  const container = document.getElementById("stepContainer");
  const progressFill = document.getElementById("progressFill");
  const progressLabel = document.getElementById("progressLabel");

  function questionIndexUpTo(stepIdx) {
    let n = 0;
    for (let i = 0; i <= stepIdx; i++) {
      if (!["intro", "results"].includes(steps[i].type)) n++;
    }
    return n;
  }

  function updateProgress() {
    const step = steps[current];
    if (step.type === "intro") {
      progressFill.style.width = "0%";
      progressLabel.textContent = "Get started";
      return;
    }
    if (step.type === "results") {
      progressFill.style.width = "100%";
      progressLabel.textContent = "Complete";
      return;
    }
    const qNum = questionIndexUpTo(current);
    progressFill.style.width = Math.round((qNum / totalQuestions) * 100) + "%";
    progressLabel.textContent = `Question ${qNum} of ${totalQuestions}`;
  }

  function isAnswered(step) {
    if (!step.required) return true;
    const v = answers[step.id];
    if (step.type === "checkbox") return Array.isArray(v) && v.length > 0;
    if (v === undefined || v === null || v === "") return false;
    return true;
  }

  function render() {
    const step = steps[current];
    updateProgress();
    container.innerHTML = "";

    if (step.type === "intro") { renderIntro(); return; }
    if (step.type === "results") { renderResults(); return; }

    const card = document.createElement("div");
    card.className = "card";

    if (step.section) {
      const tag = document.createElement("div");
      tag.className = "section-tag";
      tag.textContent = step.section;
      card.appendChild(tag);
    }

    const h = document.createElement("h2");
    h.textContent = step.title;
    card.appendChild(h);

    if (step.hint) {
      const hint = document.createElement("div");
      hint.className = "hint";
      hint.textContent = step.hint;
      card.appendChild(hint);
    }

    if (step.source) {
      const src = document.createElement("div");
      src.className = "q-source";
      src.innerHTML = `<strong>Source:</strong> ${step.source}`;
      card.appendChild(src);
    }

    if (step.type === "text" || step.type === "number") {
      const input = document.createElement("input");
      input.type = step.type === "number" ? "number" : "text";
      input.placeholder = step.placeholder || "";
      input.value = answers[step.id] || "";
      input.addEventListener("input", () => {
        answers[step.id] = input.value;
        updateNav();
      });
      card.appendChild(input);
    }

    if (step.type === "radio") {
      const wrap = document.createElement("div");
      wrap.className = "options";
      step.options.forEach((opt) => {
        const label = document.createElement("label");
        label.className = "opt" + (answers[step.id] === opt ? " checked" : "");
        label.innerHTML = `<input type="radio" name="${step.id}" ${answers[step.id] === opt ? "checked" : ""}/><span class="label">${opt}</span>`;
        label.querySelector("input").addEventListener("change", () => {
          answers[step.id] = opt;
          render();
        });
        wrap.appendChild(label);
      });
      card.appendChild(wrap);
    }

    if (step.type === "checkbox") {
      const wrap = document.createElement("div");
      wrap.className = "options";
      const current_vals = answers[step.id] || [];
      const maxPick = step.cap || Infinity;
      step.options.forEach((opt) => {
        const checked = current_vals.includes(opt);
        const label = document.createElement("label");
        label.className = "opt" + (checked ? " checked" : "");
        label.innerHTML = `<input type="checkbox" ${checked ? "checked" : ""}/><span class="label">${opt}</span>`;
        label.querySelector("input").addEventListener("change", (e) => {
          let vals = answers[step.id] || [];
          if (e.target.checked) {
            if (vals.length >= maxPick) { e.target.checked = false; return; }
            vals = [...vals, opt];
          } else {
            vals = vals.filter(v => v !== opt);
          }
          answers[step.id] = vals;
          render();
        });
        wrap.appendChild(label);
      });
      card.appendChild(wrap);
    }

    if (step.type === "scale") {
      const row = document.createElement("div");
      row.className = "scale-row";
      for (let i = 1; i <= 5; i++) {
        const btn = document.createElement("div");
        btn.className = "scale-btn" + (answers[step.id] === i ? " checked" : "");
        btn.textContent = i;
        btn.tabIndex = 0;
        btn.addEventListener("click", () => { answers[step.id] = i; render(); });
        btn.addEventListener("keypress", (e) => { if (e.key === "Enter") { answers[step.id] = i; render(); } });
        row.appendChild(btn);
      }
      card.appendChild(row);
      const labels = document.createElement("div");
      labels.className = "scale-labels";
      labels.innerHTML = `<span>${step.low}</span><span>${step.high}</span>`;
      card.appendChild(labels);
    }

    const nav = document.createElement("div");
    nav.className = "nav-row";
    if (current > 0) {
      const back = document.createElement("button");
      back.className = "nav ghost";
      back.textContent = "Back";
      back.addEventListener("click", () => { current--; render(); });
      nav.appendChild(back);
    }
    const next = document.createElement("button");
    next.className = "nav primary";
    next.id = "nextBtn";
    next.textContent = "Next";
    next.disabled = !isAnswered(step);
    next.addEventListener("click", () => { current++; render(); window.scrollTo({top:0, behavior:"smooth"}); });
    nav.appendChild(next);
    card.appendChild(nav);

    if (step.required) {
      const note = document.createElement("div");
      note.className = "required-note";
      note.textContent = "Required";
      card.appendChild(note);
    }

    container.appendChild(card);
  }

  function updateNav() {
    const btn = document.getElementById("nextBtn");
    if (btn) btn.disabled = !isAnswered(steps[current]);
  }

  function renderIntro() {
    const card = document.createElement("div");
    card.className = "card";
    card.innerHTML = `
      <div class="section-tag">MPx Dissertation Project &middot; IISc</div>
      <h1>Drinking Water &amp; Microplastics: A Quick Assessment</h1>
      <p class="lede">This short assessment does two things: it estimates your personal exposure to microplastics through drinking water, and it helps us design a portable device to detect and filter them.</p>
      <div class="intro-facts">
        <div class="intro-fact"><span class="dot"></span><span>Takes about 15-18 minutes &middot; every question moves straight to the next, no interruptions. Many questions let you pick more than one answer.</span></div>
        <div class="intro-fact"><span class="dot"></span><span>Your responses are anonymous unless you choose to leave an email for follow-up.</span></div>
        <div class="intro-fact"><span class="dot"></span><span>Where a question is based on published research, the source is noted right under it. All sources are also listed together at the end.</span></div>
      </div>
      <div class="nav-row">
        <button class="nav primary" id="startBtn">Start</button>
      </div>
    `;
    container.appendChild(card);
    document.getElementById("startBtn").addEventListener("click", () => { current++; render(); });
  }

  /* ---------------------------------------------------------
     SCORING (water & food-contact-plastic exposure only — the
     Section C "beyond water" questions are shown as context,
     not scored in, since the device's scope is drinking water)
  --------------------------------------------------------- */
  const weights = {
    sources: {
      max: 18,
      label: "Water source",
      pointsFor: (vals) => {
        const table = {
          "Bottled Water (Single-use plastic bottles)": 18,
          "Municipal Tap Water (Unfiltered)": 15,
          "Large Bottled Water (20-liter jugs)": 15,
          "Public Water Cooler / Dispenser (office, campus, public spaces)": 14,
          "Well Water / Ground Water": 12,
          "Natural Spring / River Water": 12,
          "Other": 10,
          "In-home Filter (e.g., RO, UV, Pitcher, Faucet attachment)": 6
        };
        if (!vals || !vals.length) return 0;
        return Math.max(...vals.map(v => table[v] ?? 6));
      }
    },
    filter: {
      max: 12,
      label: "Home filtration method",
      pointsFor: (vals) => {
        const table = {
          "None / I drink direct tap/ground water": 12,
          "Boiling": 7,
          "Other": 6,
          "Carbon Filter / Pitcher (e.g., Brita, PUR)": 6,
          "UV (Ultraviolet) Purifier": 5,
          "Reverse Osmosis (RO)": 4
        };
        if (!vals || !vals.length) return 0;
        return Math.max(...vals.map(v => table[v] ?? 6));
      }
    },
    containers: {
      max: 12,
      label: "Containers used to drink water",
      pointsFor: (vals) => {
        const table = {
          "Single-use Disposable Plastic Bottle (Bisleri/Kinley type)": 12,
          "Disposable Plastic Cups (events, offices, water coolers)": 11,
          "Reusable Plastic Bottle": 8,
          "Ceramic Cup / Mug": 4,
          "Glass bottles / Glass cups": 2,
          "Stainless Steel / Metal Bottle / Steel cups": 2
        };
        if (!vals || !vals.length) return 0;
        return Math.max(...vals.map(v => table[v] ?? 2));
      }
    },
    bottledFreq: {
      max: 12,
      label: "Single-use bottled water frequency",
      pointsFor: (val) => ({ "Daily": 12, "A few times a week": 8, "Rarely": 4, "Never": 0 }[val] ?? 0)
    },
    hotBev: {
      max: 8,
      label: "Hot drinks in plastic",
      pointsFor: (val) => ({ "Often": 8, "Sometimes": 5, "Rarely": 2, "Never": 0 }[val] ?? 0)
    },
    storage: {
      max: 8,
      label: "Home water storage",
      pointsFor: (vals) => {
        const table = { "Plastic containers / jugs": 8, "Other": 5, "Direct from tap (no storage)": 4, "Glass containers": 1, "Stainless steel containers": 1 };
        if (!vals || !vals.length) return 0;
        return Math.max(...vals.map(v => table[v] ?? 1));
      }
    },
    hotFoodFreq: {
      max: 8,
      label: "Hot food/drink touching plastic",
      pointsFor: (val) => ({ "6+ times a week": 8, "3-5 times a week": 6, "1-2 times a week": 3, "None": 0 }[val] ?? 0)
    },
    clingFilm: {
      max: 6,
      label: "Plastic wrap directly on food",
      pointsFor: (val) => ({ "Often": 6, "Sometimes": 4, "Rarely": 2, "Never": 0 }[val] ?? 0)
    },
    packagedFood: {
      max: 8,
      label: "Packaged food in plastic wrapping",
      pointsFor: (val) => ({ "Often (daily or more)": 8, "Sometimes (3-5 times a week)": 6, "Rarely (1-2 times a week)": 3, "Never": 0 }[val] ?? 0)
    },
    bottledBeverages: {
      max: 8,
      label: "Bottled beverages (soda, sports drinks, etc.)",
      pointsFor: (val) => ({ "Daily": 8, "A few times a week": 5, "Rarely": 2, "Never": 0 }[val] ?? 0)
    }
  };

  function computeScore() {
    const breakdown = [];
    let total = 0;
    Object.keys(weights).forEach((key) => {
      const w = weights[key];
      const pts = w.pointsFor(answers[key]);
      breakdown.push({ key, label: w.label, points: pts, max: w.max });
      total += pts;
    });
    breakdown.sort((a, b) => b.points - a.points);
    return { total, breakdown };
  }

  function tierFor(score) {
    if (score <= 25) return { name: "Low exposure", color: "var(--good)", icon: "●" };
    if (score <= 50) return { name: "Moderate exposure", color: "var(--warning)", icon: "▲" };
    if (score <= 75) return { name: "High exposure", color: "var(--serious)", icon: "▲" };
    return { name: "Very high exposure", color: "var(--critical)", icon: "■" };
  }

  function tipFor(topFactorKey) {
    const tips = {
      sources: "Your biggest factor is where your water comes from. Switching even part of your intake to a properly maintained in-home filter (and away from single-use bottled water or dispensers) is the highest-leverage change available to you.",
      filter: "Your current filtration method may not be removing sub-micron plastic particles. Consider pairing your existing filter with additional mechanical filtration, or look out for filters explicitly rated for microplastic removal as they reach the market.",
      containers: "Your drinkware is a notable contributor. Swapping single-use or disposable plastic bottles/cups for glass or stainless steel, especially for hot liquids, meaningfully cuts particle shedding.",
      bottledFreq: "Frequent single-use bottled water purchases are a major contributor — bottled water has been shown in several studies to contain more microplastics than tap water, largely from the bottle itself.",
      bottledBeverages: "Plastic-bottled beverages beyond water (soda, iced tea, sports drinks) carry the same bottle-shedding risk as bottled water — worth the same scrutiny.",
      hotBev: "Hot liquids in contact with plastic accelerate the breakdown of plastic into microplastics. Try switching to a steel, glass, or ceramic cup for tea/coffee.",
      storage: "How you store water at home matters. Moving to glass or steel storage containers, especially for water kept for more than a day, reduces gradual particle shedding.",
      hotFoodFreq: "Regular contact between hot food (including gravies/curries) and plastic packaging is a meaningful and often-overlooked exposure source.",
      clingFilm: "Direct plastic wrap contact with food, especially fatty or hot food, is a frequently underestimated exposure pathway. Swapping to a lid, plate, or beeswax wrap for storage cuts this down.",
      packagedFood: "Packaged snack and convenience foods add up — this pathway has been detected across many everyday packaged items in independent testing."
    };
    return tips[topFactorKey] || tips.sources;
  }

  function contextLevel(val, order) {
    const idx = order.indexOf(val);
    if (idx <= 0) return "low";
    if (idx === order.length - 1) return "high";
    return "moderate";
  }

  function buildPayload(total, tier, breakdown) {
    const flat = {};
    questionSteps.forEach(q => {
      let v = answers[q.id];
      if (Array.isArray(v)) v = v.join(" | ");
      flat[q.id] = v ?? "";
    });
    return {
      submittedAt: new Date().toISOString(),
      exposureScore: total,
      exposureTier: tier.name,
      ...flat
    };
  }

  function attemptSubmit(payload) {
    if (!SUBMIT_URL || submitAttempted) return Promise.resolve(false);
    submitAttempted = true;
    return fetch(SUBMIT_URL, {
      method: "POST",
      mode: "no-cors",
      headers: { "Content-Type": "text/plain;charset=utf-8" },
      body: JSON.stringify(payload)
    }).then(() => true).catch(() => false);
  }

  function renderResults() {
    const { total, breakdown } = computeScore();
    const tier = tierFor(total);
    const topFactor = breakdown[0];

    const kitchenLvl = contextLevel(answers.kitchenHeat, ["Never", "Rarely", "Sometimes", "Often"]);
    const laundryLvl = answers.syntheticLaundry === "Yes, regularly" ? "high" : (answers.syntheticLaundry === "Occasionally" ? "moderate" : "low");
    const careLvl = contextLevel(answers.personalCare, ["Never / not sure", "Rarely", "Sometimes", "Often"]);
    const seafoodLvl = contextLevel(answers.seafood, ["Never", "Rarely (a few times a month or less)", "Weekly", "Almost daily"]);

    const card = document.createElement("div");
    card.className = "card";

    const meterPct = Math.min(100, total);
    const payload = buildPayload(total, tier, breakdown);

    card.innerHTML = `
      <div class="section-tag">Your Result</div>
      <h1 style="margin-bottom:2px;">Your Water-Related Microplastics Exposure Estimate</h1>
      <p class="lede">Based on your habits, sources, and containers &mdash; not a lab measurement of your actual water.</p>
      <div class="hero">
        <span class="value">${total}</span><span class="of100">/100</span>
        <div><span class="tier-badge" style="background:${tier.color}">${tier.icon} ${tier.name}</span></div>
      </div>
      <div class="meter-track"><div class="meter-fill" style="width:${meterPct}%; background:${tier.color};"></div></div>
      <div class="meter-scale"><span>0 &middot; Low</span><span>25</span><span>50</span><span>75</span><span>100 &middot; Very High</span></div>

      <div class="tip-box"><strong>Your top contributor: ${topFactor.label}.</strong><br/>${tipFor(topFactor.key)}</div>

      <div class="breakdown">
        <h3>What made up your score</h3>
        ${breakdown.map(b => `<div class="factor-row"><span class="factor-name">${b.label}</span><span class="factor-pts">${b.points} / ${b.max}</span></div>`).join("")}
      </div>

      <div class="context-block">
        <h3>Beyond water — your broader exposure context</h3>
        <div>Heating food in plastic: <strong>${answers.kitchenHeat || "—"}</strong> (${kitchenLvl} contribution)</div>
        <div>Washing synthetic clothing: <strong>${answers.syntheticLaundry || "—"}</strong> (${laundryLvl} contribution)</div>
        <div>Synthetic share of wardrobe: <strong>${answers.syntheticClothingPct || "—"}</strong></div>
        <div>Personal care products with microbeads: <strong>${answers.personalCare || "—"}</strong> (${careLvl} contribution)</div>
        <div>Seafood consumption: <strong>${answers.seafood || "—"}</strong> (${seafoodLvl} contribution)</div>
        <div>Plastic kitchen tools used: <strong>${(answers.kitchenTools || []).join(", ") || "—"}</strong></div>
        <div>Cooking with plastic/nylon utensils: <strong>${answers.cookingUtensilFreq || "—"}</strong></div>
        <div class="q-source" style="margin-top:10px;"><strong>Source:</strong> lessmicroplastics.com/why (food/heat, indoor dust &amp; fiber categories); Kamalasekaran &amp; Sundramoorthy, RSC Advances (2026); Fendall &amp; Sewell 2009, cited in Shen et al., Marine Pollution Bulletin (2019). These are shown for context only and are not included in your water score above, since this device is scoped to drinking water.</div>
      </div>

      <div class="summary-block">
        <h3>What you told us about the device you'd want</h3>
        <div>Top worries: ${(answers.topWorry || []).join(", ") || "—"}</div>
        <div>Preferred features: ${(answers.features || []).join(", ") || "—"}</div>
        <div>Form factor(s) considered: ${(answers.formFactor || []).join(", ") || "—"}</div>
        <div>Trust builder(s): ${(answers.trustBuilder || []).join(", ") || "—"}</div>
        <div>Preferred purchase channel(s): ${(answers.purchaseChannel || []).join(", ") || "—"}</div>
        <div>Willingness to pay: ${answers.wtp ? "₹" + answers.wtp : "—"}</div>
        <div>Open to subscription/replacement cost: ${answers.subscriptionOk || "—"}</div>
        <div>Purchase likelihood (1-5): ${answers.purchaseLikelihood || "—"}</div>
        <div>Likely to replace current setup (1-5): ${answers.replaceLikelihood || "—"}</div>
      </div>

      <div class="research-block">
        <h3>What the research says</h3>
        <div class="research-item">Global plastic production has reached roughly <strong>8,300 million tonnes made to date</strong>, and only around <strong>9%</strong> has ever been recycled — the rest is landfilled, incinerated, or breaking down in the environment.<span class="src-tag">Source: Geyer, Jambeck &amp; Law, Science Advances (2017)</span></div>
        <div class="research-item">Plastic packaging is associated with a database of <strong>906 identified chemicals</strong>, of which <strong>63 rank among the highest hazard categories</strong> for human health, including endocrine-disrupting chemicals.<span class="src-tag">Source: Groh et al., Science of the Total Environment (2019); North &amp; Halden, Reviews on Environmental Health (2013)</span></div>
        <div class="research-item">Beyond direct toxicity, microplastics can act as <strong>vectors</strong> that pathogens and antibiotic-resistance genes attach to and travel on; nanoplastics have also been shown to cross the blood-brain barrier, though long-term human consequences are still being studied.<span class="src-tag">Source: Shen et al., Marine Pollution Bulletin (2019)</span></div>
        <div class="research-item">Microplastics have been detected in everyday items including beer, salt, sugar, honey, tap water, bottled water, and plastic tea bags, and are frequently transmitted through the food chain in aquatic organisms such as shellfish and seafood.<span class="src-tag">Source: Kamalasekaran &amp; Sundramoorthy, RSC Advances (2026)</span></div>
        <div class="research-item">Emerging low-cost technologies — smartphone-based fluorescence microscopy and AI-assisted image detection (e.g., Nile Red staining + deep learning) — can identify particles as small as 10 microns in about an hour, versus days on lab-grade FTIR equipment.<span class="src-tag">Source: Leonard et al., J. Hazardous Materials Letters (2022); Rermborirak et al., J. Hazardous Materials Advances (2025)</span></div>
        <div class="research-item">The World Health Organization's 2019 review concluded that, based on the evidence available at the time, chemicals and microbial pathogens associated with microplastics in drinking-water pose a <strong>low concern</strong> for human health — but it also flagged insufficient data on nanoplastic toxicity, no human epidemiological studies yet, and called for more research and continued efforts to reduce plastic pollution as a precaution.<span class="src-tag">Source: WHO, Microplastics in drinking-water (2019)</span></div>
      </div>

      <div class="disclaimer">
        This score is an educational estimate built from your self-reported habits, not a diagnostic or laboratory measurement of microplastic content in your specific water supply. Uncertainty in the underlying science is real and ongoing — the sources above are given so you can read the primary material yourself rather than take our framing at face value.
      </div>

      <div id="submitStatus"></div>

      <div class="download-row">
        <button class="nav" id="downloadJson">Download my responses (JSON)</button>
        <button class="nav" id="downloadCsv">Download (CSV)</button>
      </div>
      <div class="nav-row">
        <button class="nav" id="restartBtn">Start over</button>
      </div>
    `;
    container.appendChild(card);

    const statusEl = document.getElementById("submitStatus");
    if (SUBMIT_URL) {
      statusEl.className = "submit-status warn";
      statusEl.textContent = "Sending your response to the shared research database…";
      attemptSubmit(payload).then((sent) => {
        if (sent) {
          statusEl.className = "submit-status ok";
          statusEl.textContent = "✓ Your response has been recorded in the shared research database.";
        } else {
          statusEl.className = "submit-status warn";
          statusEl.textContent = "Couldn't reach the shared database (you may be offline). Please download your response below and send it to the research team.";
        }
      });
    } else {
      statusEl.className = "submit-status warn";
      statusEl.textContent = "This copy of the quiz isn't yet connected to the shared research database. Please download your response below and send the file to the research team, or ask them to finish the one-time collection setup.";
    }

    document.getElementById("restartBtn").addEventListener("click", () => {
      Object.keys(answers).forEach(k => delete answers[k]);
      submitAttempted = false;
      current = 0;
      render();
      window.scrollTo({top:0, behavior:"smooth"});
    });

    document.getElementById("downloadJson").addEventListener("click", () => {
      downloadBlob(JSON.stringify(payload, null, 2), "microplastics-quiz-response.json", "application/json");
    });
    document.getElementById("downloadCsv").addEventListener("click", () => {
      const rows = [["question", "answer"]];
      Object.keys(payload).forEach(k => {
        rows.push([k, (payload[k] ?? "").toString().replace(/"/g, "'")]);
      });
      const csv = rows.map(r => r.map(c => `"${c}"`).join(",")).join("\n");
      downloadBlob(csv, "microplastics-quiz-response.csv", "text/csv");
    });
  }

  function downloadBlob(content, filename, mime) {
    const blob = new Blob([content], { type: mime });
    const url = URL.createObjectURL(blob);
    const a = document.createElement("a");
    a.href = url; a.download = filename;
    document.body.appendChild(a); a.click(); document.body.removeChild(a);
    URL.revokeObjectURL(url);
  }

  render();
})();
</script>
</body>
</html>
